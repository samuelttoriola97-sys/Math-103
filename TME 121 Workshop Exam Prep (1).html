<script>
const D={"topics": [{"s": "SECTION 01: METAL MACHINING", "t": "Machining Processes"}, {"s": "SECTION 01: METAL MACHINING", "t": "Measurement"}, {"s": "SECTION 02: FOUNDRY", "t": "Casting"}, {"s": "SECTION 02: FOUNDRY", "t": "Refrigeration"}, {"s": "SECTION 02: FOUNDRY", "t": "Foundry Procedures"}, {"s": "SECTION 03: WELDING", "t": "Welding"}, {"s": "SECTION 04: WOODWORK", "t": "Woodwork"}, {"s": "SECTION 05: METAL FITTING", "t": "Tools and Equipment"}, {"s": "SECTION 05: METAL FITTING", "t": "Materials"}, {"s": "SECTION 05: METAL FITTING", "t": "Forging"}, {"s": "SECTION 05: METAL FITTING", "t": "Workshop Safety"}, {"s": "SECTION 05: METAL FITTING", "t": "Fans and Rewinding"}, {"s": "SECTION 05: METAL FITTING", "t": "Electrical Safety"}], "Q": [{"id": 0, "t": 5, "l": "2022/23 Q1(a)", "q": "Prepare well labelled diagrams of Butt and Fillet Welds indicating their characteristic features.", "o": [], "a": 0, "ans": "<ul><li><b>Butt weld:<\/b> plates lie edge to edge in one plane. Features: base metal, root opening (gap ≈ 3.2 mm), vee groove (≈ 60°), root face, weld face, toe, root.<\/li><li><b>Fillet weld:<\/b> roughly triangular weld at a right-angle joint (tee, lap, corner). Features: leg length, throat, toe, root, weld face.<\/li><\/ul><div class=\"dg\"><svg viewBox=\"0 0 340 180\" font-family=\"sans-serif\" font-size=\"10\"><g stroke=\"#222\" fill=\"#bbb\"><rect x=\"10\" y=\"60\" width=\"60\" height=\"18\"/><rect x=\"100\" y=\"60\" width=\"60\" height=\"18\"/><path d=\"M70 60h30l-8 18h-14z\" fill=\"#e8630a\"/><rect x=\"200\" y=\"100\" width=\"120\" height=\"16\"/><rect x=\"250\" y=\"48\" width=\"16\" height=\"52\"/><path d=\"M250 100v-16h-16zM266 100v-16h16z\" fill=\"#e8630a\" transform=\"translate(0,0)\"/><\/g><g fill=\"#111\"><text x=\"10\" y=\"40\">A. BUTT WELD (single vee)<\/text><text x=\"6\" y=\"98\">Base metal<\/text><text x=\"68\" y=\"54\">Weld face<\/text><text x=\"62\" y=\"96\">Root opening (gap)<\/text><text x=\"76\" y=\"110\">Vee groove ≈ 60°<\/text><text x=\"200\" y=\"40\">B. FILLET WELD (tee)<\/text><text x=\"276\" y=\"80\">Leg<\/text><text x=\"202\" y=\"132\">Root · Toe · Throat<\/text><text x=\"270\" y=\"134\">Base metal<\/text><\/g><\/svg><\/div><p class=\"tip\"><b>Exam-hall tip:<\/b> Draw plates with a ruler. Show the groove, root gap and weld face for the butt joint; show the triangular weld, legs, toe, root and throat for the fillet.<\/p>", "src": "past"}, {"id": 1, "t": 5, "l": "2022/23 Q1(b)", "q": "In what instance will you proceed to make Double-Vee Butt Weld and what will be your specifications while making this?", "o": [], "a": 0, "ans": "<ul><li><b>When:<\/b> plates thicker than about 13 mm, and welding can be done from <b>both sides<\/b>. (A single-vee is used up to ≈ 15.8 mm.)<\/li><li><b>Specifications:<\/b> top vee angle 60° or 80°; bottom vee 80° (depends on technique); small root gap; clean edges free of rust and scale.<\/li><li>Advantage: less filler metal and less distortion than a very deep single vee.<\/li><\/ul>", "src": "past"}, {"id": 2, "t": 2, "l": "2022/23 Q1(c)", "q": "Highlight four main elements common to both hot chamber and cold chamber die casting machines.", "o": [], "a": 0, "ans": "<ol><li>A source of molten metal<\/li><li>An injection mechanism<\/li><li>A mould (die)<\/li><li>A clamping system<\/li><\/ol><p>In a hot chamber machine the injection plunger is submerged in the molten metal (zinc, tin, lead alloys). In a cold chamber machine it is outside (aluminium, copper alloys).<\/p>", "src": "past"}, {"id": 3, "t": 0, "l": "2022/23 Q2(a) / 2021/22 Q4(a)", "q": "With the aid of a well labelled diagram, sketch the arrangement of a centre lathe machine showing the four (4) major parts.", "o": [], "a": 0, "ans": "<ol><li><b>Headstock<\/b> – holds the spindle and chuck, drives the work.<\/li><li><b>Bed<\/b> – rigid casting with ways that guide and support all parts.<\/li><li><b>Carriage<\/b> – saddle, cross-slide, compound rest, apron; carries the tool.<\/li><li><b>Tailstock<\/b> – supports the right end of the work; holds drills and the dead centre.<\/li><\/ol><div class=\"dg\"><svg viewBox=\"0 0 340 170\" font-family=\"sans-serif\" font-size=\"10\"><rect x=\"10\" y=\"110\" width=\"320\" height=\"16\" fill=\"#777\" stroke=\"#222\"/><rect x=\"14\" y=\"126\" width=\"12\" height=\"30\" fill=\"#555\"/><rect x=\"304\" y=\"126\" width=\"12\" height=\"30\" fill=\"#555\"/><rect x=\"10\" y=\"50\" width=\"70\" height=\"60\" fill=\"#c8c8c8\" stroke=\"#222\"/><rect x=\"80\" y=\"64\" width=\"14\" height=\"32\" fill=\"#444\"/><rect x=\"94\" y=\"72\" width=\"150\" height=\"16\" fill=\"#e8630a\" opacity=\".6\"/><rect x=\"130\" y=\"86\" width=\"56\" height=\"24\" fill=\"#aaa\" stroke=\"#222\"/><rect x=\"138\" y=\"62\" width=\"40\" height=\"24\" fill=\"#d6d6d6\" stroke=\"#222\"/><path d=\"M150 62l6-12h8l6 12z\" fill=\"#333\"/><rect x=\"250\" y=\"62\" width=\"64\" height=\"48\" fill=\"#c8c8c8\" stroke=\"#222\"/><rect x=\"244\" y=\"76\" width=\"8\" height=\"12\" fill=\"#444\"/><g fill=\"#111\"><text x=\"14\" y=\"42\">1 Headstock (spindle, chuck)<\/text><text x=\"124\" y=\"46\">Tool post<\/text><text x=\"128\" y=\"136\">2 Carriage (saddle, apron)<\/text><text x=\"110\" y=\"152\">3 Bed (ways)<\/text><text x=\"236\" y=\"52\">4 Tailstock<\/text><text x=\"118\" y=\"104\" fill=\"#b8470a\">Workpiece<\/text><\/g><\/svg><\/div><p class=\"tip\"><b>Exam-hall tip:<\/b> Sketch bed first, then headstock (left), tailstock (right), carriage in between. Number the four major parts.<\/p>", "src": "past"}, {"id": 4, "t": 0, "l": "2022/23 Q2(b) / 2021/22 Q4(b)", "q": "There are many operations that could be performed on the lathe machine. List six (6) of these operations; and describe how facing and step-turning operations could be performed.", "o": [], "a": 0, "ans": "<p><b>Six operations:<\/b> turning, facing, taper turning, threading, drilling, boring, knurling, parting-off.<\/p><p><b>Facing:<\/b><\/p><ol><li>Grip the work in the chuck with short overhang.<\/li><li>Set the tool at centre height, square to the axis.<\/li><li>Start the spindle; feed the cross-slide across the end face (centre-out or edge-in).<\/li><li>Use light cuts; lock the carriage.<\/li><\/ol><p><b>Step-turning:<\/b><\/p><ol><li>Mark each shoulder position with chalk or scriber.<\/li><li>Rough-turn to the first diameter along the carriage feed, stopping at the mark.<\/li><li>Repeat for each smaller diameter.<\/li><li>Square each shoulder with the cross-slide and check sizes with a caliper.<\/li><\/ol>", "src": "past"}, {"id": 5, "t": 0, "l": "2022/23 Q3", "q": "A carbon steel bar 7.64 in diameter, tensile strength 65,000 lb/in² and shear strength 45,000 lb/in², is turned at 400 ft/min, feed 0.011 in/rev, depth of cut 0.120 in. Rake angle 130, chip ratio 0.52. Using the orthogonal model determine: (a) the shear plane angle and shear force, (b) cutting force and feed force, (c) coefficient of friction between tool and chip.", "o": [], "a": 0, "ans": "<p class=\"tip\">Assumptions: rake angle α = 13° (the paper prints \"130\"). Friction angle is found from Merchant's equation, since no force is given. Tensile strength is not needed.<\/p><p><b>(a)<\/b> tan φ = r cosα / (1 − r sinα) = 0.52(0.9744) / (1 − 0.52(0.2250)) = 0.5067/0.8830 = 0.5738, so <b>φ ≈ 29.8°<\/b>.<br>t₀ = 0.011 in, w = 0.120 in. A<sub>s<\/sub> = t₀w / sinφ = 0.00132/0.4977 = 0.00265 in².<br>F<sub>s<\/sub> = S·A<sub>s<\/sub> = 45,000 × 0.00265 = <b>≈ 119 lb<\/b>.<\/p><p><b>(b)<\/b> Merchant: φ = 45° + α/2 − β/2, so β = 90° + α − 2φ = 90 + 13 − 59.7 = 43.3°.<br>F<sub>c<\/sub> = F<sub>s<\/sub> cos(β−α) / cos(φ+β−α) = 119 × 0.8634 / 0.4976 = <b>≈ 207 lb<\/b>.<br>F<sub>t<\/sub> = F<sub>s<\/sub> sin(β−α) / cos(φ+β−α) = 119 × 0.5046 / 0.4976 = <b>≈ 121 lb<\/b>.<\/p><p><b>(c)<\/b> μ = tan β = tan 43.3° = <b>≈ 0.94<\/b>.<\/p>", "src": "past"}, {"id": 6, "t": 0, "l": "2022/23 Q4(a) / 2021/22 Q5(a)", "q": "Find the cutting speed in metres per minute for each of the following: (i) turning a round bar of 50 mm diameter at 120 rev/min (ii) turning a round bar of 20 mm diameter at 400 rev/min.", "o": [], "a": 0, "ans": "<p>Formula: <b>V = πDN / 1000<\/b> (V in m/min, D in mm, N in rev/min).<\/p><p>(i) V = π × 50 × 120 / 1000 = <b>18.85 m/min<\/b><\/p><p>(ii) V = π × 20 × 400 / 1000 = <b>25.13 m/min<\/b><\/p>", "src": "past"}, {"id": 7, "t": 6, "l": "2022/23 Q4(b) / 2021/22 Q5(b)", "q": "List and explain the functions of seven (7) Woodwork geometrical tools.", "o": [], "a": 0, "ans": "<ol><li><b>Steel rule / metre rule<\/b> – measures lengths.<\/li><li><b>Steel tape<\/b> – large dimensions and overall length.<\/li><li><b>Try square<\/b> – checks and marks 90° angles and squareness.<\/li><li><b>Bevel square<\/b> – adjustable; marks and checks angles 0–180°.<\/li><li><b>Marking gauge<\/b> – scribes lines parallel to an edge.<\/li><li><b>Mortise gauge<\/b> – scribes two parallel lines for a mortise.<\/li><li><b>Marking knife / scriber<\/b> – cuts the pencil line into a fine scratch.<\/li><li><b>Straight edge<\/b> – checks flatness and straightness.<\/li><\/ol>", "src": "past"}, {"id": 8, "t": 0, "l": "2022/23 Q5(a) / 2014/15 Q4(a),(b)", "q": "Define machining; and highlight two reasons for heat generation at the cutting region.", "o": [], "a": 0, "ans": "<p><b>Machining<\/b> is a manufacturing process that creates the desired shape by removing unwanted material from a larger piece using a machine tool.<\/p><p><b>Heat comes from:<\/b><\/p><ol><li>Plastic deformation (shearing) of the metal in the shear zone.<\/li><li>Friction between the chip and the tool face, and between the tool flank and the workpiece.<\/li><\/ol><p>Result: tool wear increases and tool life falls.<\/p>", "src": "past"}, {"id": 9, "t": 0, "l": "2022/23 Q5(b) / 2014/15 Q4(c)", "q": "Mention three steps to take in order to reduce or overcome the high temperature at the cutting region.", "o": [], "a": 0, "ans": "<ol><li>Apply cutting fluid (coolant and lubricant), especially at high speeds.<\/li><li>Reduce cutting speed, feed or depth of cut.<\/li><li>Use sharp tools of correct geometry and suitable material (HSS or carbide).<\/li><\/ol>", "src": "past"}, {"id": 10, "t": 0, "l": "2022/23 Q5(c) / 2014/15 Q4(d)", "q": "In which order will you carry out facing, turning and boring operations on a work piece and state why?", "o": [], "a": 0, "ans": "<p><b>Order: facing → turning → boring.<\/b><\/p><ul><li>Facing gives a flat, square reference end for accurate positioning and holding.<\/li><li>It ensures concentricity of the diameters and holes machined afterwards.<\/li><li>It gives clearance for later tools.<\/li><li>Boring last avoids weakening the work before it is clamped for facing and turning.<\/li><\/ul>", "src": "past"}, {"id": 11, "t": 1, "l": "2021/22 Q1(a)", "q": "Why do we need a form of precise measurement in a workshop?", "o": [], "a": 0, "ans": "<ul><li>Parts made by different people or factories must fit together (interchangeability).<\/li><li>Spare parts can be made years later and still fit.<\/li><li>Controls quality and reduces waste and rework.<\/li><li>All instruments refer to one standard of length: the metre.<\/li><\/ul>", "src": "past"}, {"id": 12, "t": 1, "l": "2021/22 Q1(b)", "q": "State Abbe principle; and mention and describe one instrument which complies with the principle.", "o": [], "a": 0, "ans": "<p><b>Abbe principle:<\/b> the reading axis and the measuring axis of an instrument must be co-axial (in line) for maximum accuracy. Any separation causes error.<\/p><p><b>Micrometre<\/b> complies. Parts: frame, anvil, spindle, sleeve, thimble, ratchet. The spindle thread pitch is 0.5 mm, so one turn moves 0.5 mm. The scale lies along the same axis as the measurement.<\/p><p>The vernier caliper does <b>not<\/b> comply; the vernier depth gauge does.<\/p>", "src": "past"}, {"id": 13, "t": 1, "l": "2021/22 Q2(a)", "q": "What is the most common instrument that uses vernier principle? and in what range of measuring capacities do they come? Justify the claim that the instrument in question is possibly the best general purpose measuring instrument.", "o": [], "a": 0, "ans": "<p>The <b>vernier caliper<\/b>. Ranges: <b>0–150 mm up to 0–1000 mm<\/b>.<\/p><p>Best general-purpose because it measures external, internal, step and depth dimensions, is easy to use, covers a wide range, reads to 0.02 mm, and comes in normal, dial and digital versions.<\/p>", "src": "past"}, {"id": 14, "t": 1, "l": "2021/22 Q2(b)", "q": "Using necessary numeric / numbers, describe the operation of vernier instrument.", "o": [], "a": 0, "ans": "<ul><li>Fixed scale is in mm. The vernier scale has 50 divisions equal to 49 mm, so each vernier division = 0.98 mm.<\/li><li>Least count = 1 − 0.98 = <b>0.02 mm<\/b>.<\/li><li>Reading = main scale reading just before the vernier zero + (coinciding line × 0.02).<\/li><\/ul><p><b>Example:<\/b> zero lies after 24 mm; the 13th vernier line coincides. Reading = 24 + 13 × 0.02 = <b>24.26 mm<\/b>.<\/p>", "src": "past"}, {"id": 15, "t": 7, "l": "2021/22 Q3(a)", "q": "Highlight and sketch five types of power tools.", "o": [], "a": 0, "ans": "<p>Five: <b>drilling machine<\/b> (holes), <b>angle grinder<\/b> (cutting, grinding, polishing), <b>jigsaw<\/b> (curved cuts), <b>circular saw<\/b> (ripping and cross-cutting), <b>impact wrench/driver<\/b> (high-torque nuts and screws). Others: nail gun, power plane, orbital sander, router, cut-off machine.<\/p><p class=\"tip\">Sketch each as a simple outline: body, handle, switch and working part (bit, disc or blade), and label them.<\/p>", "src": "past"}, {"id": 16, "t": 8, "l": "2021/22 Q3(b)", "q": "In a Tabular form, classify Engineering Materials.", "o": [], "a": 0, "ans": "<table><tr><th>Metallic<\/th><th>Examples<\/th><\/tr><tr><td>Ferrous<\/td><td>Pig iron, cast iron, wrought iron, steels<\/td><\/tr><tr><td>Non-ferrous<\/td><td>Copper, aluminium, brass, bronze, tin, zinc, lead<\/td><\/tr><tr><th>Non-metallic<\/th><th>Examples<\/th><\/tr><tr><td>Organic<\/td><td>Plastic, wood, paper, rubber, leather<\/td><\/tr><tr><td>Inorganic<\/td><td>Cement, glass, ceramics, graphite, minerals<\/td><\/tr><\/table>", "src": "past"}, {"id": 17, "t": 9, "l": "2013/14 Q2(a); 2014/15 Q1(a)", "q": "What is meant by forging?", "o": [], "a": 0, "ans": "<p>Forging is a method of heating a metal to reddish form, then beating it to a desired shape. It is shaping metal under squeeze or impact pressure to a desired shape and dimension, by plastic deformation.<\/p>", "src": "past"}, {"id": 18, "t": 9, "l": "2013/14 Q2(b); 2014/15 Q1(b)", "q": "Distinguish between cold and hot forging.", "o": [], "a": 0, "ans": "<table><tr><th><\/th><th>Cold forging<\/th><th>Hot forging<\/th><\/tr><tr><td>Temperature<\/td><td>Room temperature<\/td><td>High (up to ≈ 75% of melting point)<\/td><\/tr><tr><td>Force<\/td><td>High pressure<\/td><td>Lower pressure<\/td><\/tr><tr><td>Shapes<\/td><td>Simpler<\/td><td>More complex<\/td><\/tr><tr><td>Strength<\/td><td>Increased (strain hardening)<\/td><td>Lower hardness, higher ductility<\/td><\/tr><tr><td>Finish<\/td><td>Excellent<\/td><td>May need finishing (scale)<\/td><\/tr><\/table>", "src": "past"}, {"id": 19, "t": 9, "l": "2013/14 Q2(c); 2014/15 Q1(c)", "q": "Identify the two (2) types of forging process based on the type of die.", "o": [], "a": 0, "ans": "<ol><li><b>Open-die forging<\/b> – flat-faced dies direct metal flow; used for preliminary shaping and simple shapes.<\/li><li><b>Closed-die (impression-die) forging<\/b> – billet squeezed in a cavity between shaped dies; used for valve parts, gears, connecting rods, spanners.<\/li><\/ol>", "src": "past"}, {"id": 20, "t": 3, "l": "2013/14 Q3; 2014/15 Q1(d),(e)", "q": "What is meant by Refrigeration? Identify the four (4) major components of the refrigeration cycle and state their functions.", "o": [], "a": 0, "ans": "<p>Refrigeration is removing heat from a space or substance to make it colder than its surroundings.<\/p><ol><li><b>Compressor<\/b> – raises pressure and temperature of the refrigerant vapour; circulates it.<\/li><li><b>Condenser<\/b> – rejects heat; vapour becomes high-pressure liquid.<\/li><li><b>Expansion (throttle) valve<\/b> – drops the pressure; some liquid flashes to vapour.<\/li><li><b>Evaporator<\/b> – absorbs heat from the cooled space as the refrigerant evaporates.<\/li><\/ol><div class=\"dg\"><svg viewBox=\"0 0 320 190\" font-family=\"sans-serif\" font-size=\"11\"><g stroke=\"#222\" fill=\"#fff\"><rect x=\"120\" y=\"14\" width=\"80\" height=\"34\" rx=\"6\"/><rect x=\"230\" y=\"78\" width=\"80\" height=\"34\" rx=\"6\"/><rect x=\"120\" y=\"142\" width=\"80\" height=\"34\" rx=\"6\"/><rect x=\"10\" y=\"78\" width=\"90\" height=\"34\" rx=\"6\"/><\/g><g fill=\"#111\"><text x=\"128\" y=\"35\">Condenser<\/text><text x=\"238\" y=\"99\">Expansion<\/text><text x=\"128\" y=\"163\">Evaporator<\/text><text x=\"24\" y=\"99\">Compressor<\/text><\/g><g stroke=\"#e8630a\" stroke-width=\"2\" fill=\"none\"><path d=\"M100 90H110V31h10\"/><path d=\"M200 31h60v47\"/><path d=\"M270 112v47h-70\"/><path d=\"M120 159H55V112\"/><\/g><g font-size=\"9\" fill=\"#555\"><text x=\"4\" y=\"60\">hot HP vapour<\/text><text x=\"205\" y=\"22\">HP liquid<\/text><text x=\"206\" y=\"140\">cold LP mix<\/text><text x=\"4\" y=\"150\">LP vapour<\/text><\/g><\/svg><\/div><p class=\"tip\"><b>Exam-hall tip:<\/b> Draw a closed loop with four boxes and arrows. Heat out at the condenser, heat in at the evaporator.<\/p>", "src": "past"}, {"id": 21, "t": 3, "l": "2013/14 Q3(d); 2014/15 Q1(f)", "q": "State at least five (5) requirements of refrigerant in a refrigeration cycle.", "o": [], "a": 0, "ans": "<ol><li>High latent heat of vaporisation<\/li><li>Chemically stable<\/li><li>Non-corrosive<\/li><li>Suitable operating pressures<\/li><li>Miscible with compressor oil (where needed)<\/li><li>Low ozone-depletion and global-warming potential<\/li><li>Non-toxic and non-flammable, and low cost<\/li><\/ol>", "src": "past"}, {"id": 22, "t": 2, "l": "2013/14 Q4(a),(b); 2014/15 Q1(g),(h)", "q": "What is casting? Draw a systematic flow-chart for the procedures involved in sand casting operation.", "o": [], "a": 0, "ans": "<p>Casting is pouring liquid metal into a mould cavity and letting it solidify to get the final shape.<\/p><div class=\"dg\"><div class=\"flow\"><span>Pattern making<\/span> <b>→<\/b> <span>Mould preparation<\/span> <b>→<\/b> <span>Metal melting<\/span> <b>→<\/b> <span>Pouring<\/span> <b>→<\/b> <span>Solidification &amp; cooling<\/span> <b>→<\/b> <span>Shakeout<\/span> <b>→<\/b> <span>Cleaning / fettling<\/span> <b>→<\/b> <span>Inspection<\/span><\/div><\/div><p class=\"tip\"><b>Exam-hall tip:<\/b> Draw each stage as a boxed step joined with arrows, top to bottom.<\/p>", "src": "past"}, {"id": 23, "t": 10, "l": "2013/14 Q1(c); 2017/18 Q1(m)", "q": "List at least five (5) safety precautions to be taken in a fitting workshop.", "o": [], "a": 0, "ans": "<ol><li>Wear goggles when chipping or grinding.<\/li><li>No oil or grease on hammer handles; heads must be tight.<\/li><li>Do not use files without handles.<\/li><li>Never use chisels with mushroom heads.<\/li><li>Clear chips with a brush, not bare hands.<\/li><li>Keep floors and gangways clear and dry.<\/li><li>No loose clothing, rings or watches.<\/li><li>Do not use a try square as a hammer.<\/li><\/ol>", "src": "past"}, {"id": 24, "t": 7, "l": "2013/14 Q1(d)", "q": "List at least five (5) basic rules on use of Hacksaw.", "o": [], "a": 0, "ans": "<ol><li>Saw at about 50–60 strokes per minute.<\/li><li>Pressure on the forward stroke only; do not force.<\/li><li>Teeth point forward.<\/li><li>Hold the front of the frame with the left hand.<\/li><li>Keep the work rigid in the vice with little overhang.<\/li><li>Keep at least three teeth in contact with the work.<\/li><li>Replace worn blades; if a blade breaks, start the new cut from the opposite side.<\/li><\/ol>", "src": "past"}, {"id": 25, "t": 0, "l": "2013/14 Q1(b)", "q": "State four (4) functions of cutting fluid in metal cutting operation.", "o": [], "a": 0, "ans": "<ol><li>Cools the tool and workpiece.<\/li><li>Lubricates, reducing friction.<\/li><li>Washes away chips.<\/li><li>Improves surface finish and tool life, and protects against corrosion.<\/li><\/ol>", "src": "past"}, {"id": 26, "t": 2, "l": "Practice sheet: Foundry", "q": "Define Casting. Differentiate between Die and Sand Casting.", "o": [], "a": 0, "ans": "<p>Casting: pouring molten metal into a mould cavity to solidify.<\/p><table><tr><th><\/th><th>Sand casting<\/th><th>Die casting<\/th><\/tr><tr><td>Mould<\/td><td>Expendable sand mould, broken to remove casting<\/td><td>Permanent metal die, reusable<\/td><\/tr><tr><td>Pressure<\/td><td>Gravity pour<\/td><td>Molten metal injected under high pressure<\/td><\/tr><tr><td>Finish/accuracy<\/td><td>Rougher, porous<\/td><td>Better finish and tolerances<\/td><\/tr><tr><td>Volume<\/td><td>Low volume, large parts<\/td><td>High volume, small to medium parts<\/td><\/tr><\/table>", "src": "test"}, {"id": 27, "t": 9, "l": "Practice sheet: Forging", "q": "Explain what is meant by a TUYERE.", "o": [], "a": 0, "ans": "<p>The tuyere is the nozzle at the lower end of the air pipe in the blacksmith's hearth. The fan's air blast (150–200 mm water column) passes through it to the fuel. It has a hole for raking out ashes and slag.<\/p>", "src": "test"}, {"id": 28, "t": 10, "l": "Lecture 1", "q": "State the general workshop safety rules, including the three safety Cs.", "o": [], "a": 0, "ans": "<ul><li>Three Cs: <b>carefulness, concentration, consideration<\/b>.<\/li><li>Know how to <b>STOP<\/b> a machine before you learn how to start it.<\/li><li>Wear correct protective clothing and toe-covering shoes; no loose gowns, earrings or watches.<\/li><li>Keep machine guards in place.<\/li><li>Use goggles during grinding; gloves for swarf, with a brush to clean.<\/li><li>Hold hot work downwards near the ground when moving it.<\/li><\/ul>", "src": "lec"}, {"id": 29, "t": 10, "l": "Lecture 4", "q": "Define Personal Protective Equipment (PPE) and name its types by body part.", "o": [], "a": 0, "ans": "<p>PPE is all equipment designed to be worn or held at work to protect against one or more risks.<\/p><table><tr><th>Part<\/th><th>PPE<\/th><\/tr><tr><td>Head<\/td><td>Helmets, bump caps, hair nets<\/td><\/tr><tr><td>Face/eyes<\/td><td>Goggles, spectacles, welding screens, face shields<\/td><\/tr><tr><td>Hearing<\/td><td>Plugs, muffs<\/td><\/tr><tr><td>Body<\/td><td>Coveralls, hi-vis vests, insulated jackets<\/td><\/tr><tr><td>Lungs<\/td><td>Dust masks, respirators<\/td><\/tr><tr><td>Hands<\/td><td>Gloves, gauntlets<\/td><\/tr><tr><td>Feet<\/td><td>Safety shoes, boots<\/td><\/tr><\/table>", "src": "lec"}, {"id": 30, "t": 10, "l": "Lectures 3 and 4", "q": "Explain the fire triangle and the hierarchy of control.", "o": [], "a": 0, "ans": "<p>Fire needs <b>fuel, oxygen and heat<\/b> (plus the chemical reaction). Remove one to stop fire: starvation, smothering, cooling.<\/p><p>Hierarchy of control, best to least: 1 Elimination, 2 Substitution, 3 Engineering controls, 4 Segregation, 5 Reduced exposure time, 6 PPE.<\/p>", "src": "lec"}, {"id": 31, "t": 10, "l": "Lecture 2", "q": "Describe safe manual lifting technique.", "o": [], "a": 0, "ans": "<ol><li>Assess the load, route and your limits; get help or a mechanical aid if heavy.<\/li><li>Feet apart, leading foot forward.<\/li><li>Bend the knees, keep the back straight, head up.<\/li><li>Firm grip; keep the load close to the body.<\/li><li>Lift with the leg muscles; avoid twisting.<\/li><\/ol>", "src": "lec"}, {"id": 32, "t": 7, "l": "Lecture 5", "q": "List the types of engineer's files by shape and state the use of one.", "o": [], "a": 0, "ans": "<p>Rectangular (hand), warding (flat), square, triangular, round, half-round, knife. Special: dreadnought, rasp, riffler, needle.<\/p><p>Example: the <b>half-round file<\/b> files curved surfaces, with a flat double-cut side and a curved single-cut side. Files cut on the <b>forward stroke only<\/b>.<\/p>", "src": "lec"}, {"id": 33, "t": 6, "l": "Lecture 7", "q": "Name the parts of a tree trunk cross-section and state the function of the cambium layer.", "o": [], "a": 0, "ans": "<p>Pith (medulla), heartwood (truewood), sapwood, cambium, bark (cortex), medullary rays, growth rings.<\/p><p>The <b>cambium<\/b> is the thin layer that grows and divides to form new xylem (sapwood) inwards and phloem (inner bark) outwards, the \"factory of the tree\".<\/p>", "src": "lec"}, {"id": 34, "t": 7, "l": "Forging handout", "q": "Name the main blacksmith's tools and state their uses.", "o": [], "a": 0, "ans": "<ul><li><b>Open-hearth forge<\/b> – heats the metal.<\/li><li><b>Anvil<\/b> (80–300 kg) – horn bends, face forges, hardie and pritchel holes hold tools and punch.<\/li><li><b>Tongs<\/b> – grip hot work.<\/li><li><b>Sledge/hand hammers<\/b> – striking.<\/li><li><b>Fuller<\/b> – draws out and necks down. <b>Swage<\/b> – rounds. <b>Flatter<\/b> – smooths flat faces.<\/li><li><b>Hot chisel<\/b> (30–45°), <b>cold chisel<\/b> (60–80°), <b>hardie<\/b>, <b>punch<\/b>, <b>swage block<\/b>, <b>double calipers<\/b>, <b>gauges<\/b>, <b>templates<\/b>.<\/li><\/ul>", "src": "lec"}, {"id": 35, "t": 4, "l": "Foundry practical", "q": "Describe the procedure for preparing a sand mould with a solid pattern.", "o": [], "a": 0, "ans": "<ol><li>Prepare green sand: add a little water, turn the heap, then sieve.<\/li><li>Place the pattern flat side down on the surface board and the drag around it.<\/li><li>Sprinkle parting powder; fill the drag with sand and ram evenly.<\/li><li>Strike off the surplus; turn the drag over.<\/li><li>Fit the cope with guide pins; add parting sand.<\/li><li>Place sprue and riser pins; fill and ram the cope.<\/li><li>Vent the cope with a vent wire; cut the pouring cup.<\/li><li>Withdraw the sprue and riser pins; lift off the cope.<\/li><li>Cut runners; draw the pattern with a draw spike.<\/li><li>Blow out loose sand; close the mould.<\/li><li>Melt and pour; after solidifying, shake out and fettle.<\/li><\/ol><div class=\"dg\"><svg viewBox=\"0 0 320 210\" font-family=\"sans-serif\" font-size=\"10\"><rect x=\"40\" y=\"46\" width=\"220\" height=\"56\" fill=\"#d9b98a\" stroke=\"#333\"/><rect x=\"40\" y=\"102\" width=\"220\" height=\"56\" fill=\"#c9a574\" stroke=\"#333\"/><rect x=\"110\" y=\"88\" width=\"90\" height=\"28\" fill=\"#fff\" stroke=\"#333\"/><rect x=\"72\" y=\"46\" width=\"14\" height=\"46\" fill=\"#fff\" stroke=\"#333\"/><rect x=\"224\" y=\"46\" width=\"14\" height=\"42\" fill=\"#fff\" stroke=\"#333\"/><path d=\"M60 46l8-14h28l8 14z\" fill=\"#fff\" stroke=\"#333\"/><path d=\"M86 90h24v6H86z\" fill=\"#fff\" stroke=\"#333\"/><rect x=\"30\" y=\"158\" width=\"240\" height=\"8\" fill=\"#555\"/><rect x=\"34\" y=\"80\" width=\"6\" height=\"44\" fill=\"#888\"/><rect x=\"260\" y=\"80\" width=\"6\" height=\"44\" fill=\"#888\"/><line x1=\"40\" y1=\"102\" x2=\"260\" y2=\"102\" stroke=\"#e8630a\" stroke-dasharray=\"4\"/><g fill=\"#111\"><text x=\"2\" y=\"24\">Pouring cup<\/text><text x=\"106\" y=\"30\">Sprue<\/text><text x=\"214\" y=\"38\">Riser<\/text><text x=\"140\" y=\"80\">Mould cavity<\/text><text x=\"64\" y=\"112\">Runner<\/text><text x=\"270\" y=\"74\">Cope<\/text><text x=\"270\" y=\"134\">Drag<\/text><text x=\"270\" y=\"106\" fill=\"#e8630a\">Parting line<\/text><text x=\"2\" y=\"104\">Guide pin<\/text><text x=\"100\" y=\"180\">Surface (bottom) board<\/text><text x=\"110\" y=\"136\">Green sand<\/text><\/g><\/svg><\/div><p class=\"tip\"><b>Exam-hall tip:<\/b> Draw the two boxes first (cope above drag), then cavity, sprue, riser, runner. Use leader lines and label every part.<\/p>", "src": "lec"}, {"id": 36, "t": 5, "l": "Course guide: Welding", "q": "List the equipment and safety recommendations for arc welding.", "o": [], "a": 0, "ans": "<p><b>Equipment:<\/b> power source (AC transformer or DC generator), cables, electrode holder, earth clamp, electrodes, hand shield or helmet, chipping hammer, wire brush, apron, gloves.<\/p><p><b>Safety:<\/b> earth the machine; use a shield with filter glass (arc gives UV and IR); wear gloves, apron and boots; check equipment regularly; ventilate; no flammables nearby.<\/p>", "src": "lec"}, {"id": 37, "t": 5, "l": "Generated practice", "q": "Differentiate between welding, brazing and soldering.", "o": [], "a": 0, "ans": "<table><tr><th>Process<\/th><th>Filler<\/th><th>Base metal<\/th><\/tr><tr><td>Welding<\/td><td>Optional, similar metal<\/td><td>Melted (fusion)<\/td><\/tr><tr><td>Brazing<\/td><td>Melts above 450°C<\/td><td>Not melted; capillary action<\/td><\/tr><tr><td>Soft soldering<\/td><td>Tin-lead alloy, below 300°C<\/td><td>Not melted<\/td><\/tr><\/table>", "src": "prac"}, {"id": 38, "t": 0, "l": "Generated practice", "q": "Differentiate between up milling and down milling.", "o": [], "a": 0, "ans": "<table><tr><th>Up milling<\/th><th>Down milling<\/th><\/tr><tr><td>Work fed against the cutter<\/td><td>Work fed with the cutter<\/td><\/tr><tr><td>Chips thicken progressively<\/td><td>Chips thin progressively<\/td><\/tr><tr><td>Cutting force lifts the work; strong clamping<\/td><td>Force presses work onto the table<\/td><\/tr><tr><td>Poorer finish; harder materials<\/td><td>Better finish; softer materials<\/td><\/tr><\/table>", "src": "prac"}, {"id": 39, "t": 2, "l": "Generated practice", "q": "Differentiate between hot chamber and cold chamber die casting.", "o": [], "a": 0, "ans": "<p>Hot chamber: the injection plunger is submerged in molten metal; suitable for zinc, tin and lead alloys; pressures 14–28 MPa. Cold chamber: metal is ladled into the chamber; used for aluminium and copper alloys which attack a submerged plunger. Both have four elements: molten metal source, injection mechanism, die and clamp.<\/p>", "src": "prac"}, {"id": 40, "t": 9, "l": "Generated practice", "q": "Describe how a screw driver can be produced by forging.", "o": [], "a": 0, "ans": "<ol><li>Draw the diagram and cut the 250 mm × 10 mm mild steel rod with a hacksaw.<\/li><li>Heat the end to reddish form in the open-hearth furnace; hold with round-nose tongs.<\/li><li>Place on the anvil; the striker beats the tip flat with the sledge hammer while you guide with the hand hammer.<\/li><li>Reheat as needed; time it to the reddish colour.<\/li><li>Cool naturally; file to shape.<\/li><li>Fit a wooden handle.<\/li><\/ol><p>Safety: overalls, gloves, goggles; hold hot work downwards.<\/p>", "src": "prac"}, {"id": 41, "t": 6, "l": "2013/14 Q4(c); 2014/15 Q1(i); 2017/18 Q1(i)", "q": "Identify the following wood joints: (i) (ii) (iii).", "o": [], "a": 0, "ans": "<p>I could not read pictures (i) and (iii) in the scans, so match them to this key. Your 2014/15 note calls (ii) <b>cross<\/b>, so (ii) is a <b>cross halving joint<\/b>.<\/p><div class=\"dg\"><svg viewBox=\"0 0 360 236\" font-family=\"sans-serif\" font-size=\"11\"><rect x=\"15\" y=\"30\" width=\"80\" height=\"16\" fill=\"#d9b98a\" stroke=\"#333\"/><rect x=\"45\" y=\"10\" width=\"16\" height=\"70\" fill=\"#c9a574\" stroke=\"#333\"/><rect x=\"45\" y=\"30\" width=\"16\" height=\"16\" fill=\"#b8884a\" stroke=\"#333\"/><text x=\"55\" y=\"100\" text-anchor=\"middle\">1 Cross halving<\/text><rect x=\"135\" y=\"10\" width=\"22\" height=\"80\" fill=\"#c9a574\" stroke=\"#333\"/><rect x=\"157\" y=\"40\" width=\"50\" height=\"18\" fill=\"#d9b98a\" stroke=\"#333\"/><rect x=\"150\" y=\"42\" width=\"8\" height=\"14\" fill=\"#b8884a\" stroke=\"#333\"/><text x=\"170\" y=\"106\" text-anchor=\"middle\">2 Mortise and tenon<\/text><rect x=\"255\" y=\"20\" width=\"70\" height=\"60\" fill=\"#d9b98a\" stroke=\"#333\"/><path d=\"M255 30h24l-6 10h30l-6-10h24M255 60h24l-6 10h30l-6-10h24\" fill=\"none\" stroke=\"#333\"/><text x=\"290\" y=\"100\" text-anchor=\"middle\">3 Dovetail<\/text><rect x=\"20\" y=\"140\" width=\"80\" height=\"20\" fill=\"#c9a574\" stroke=\"#333\"/><rect x=\"52\" y=\"160\" width=\"16\" height=\"50\" fill=\"#d9b98a\" stroke=\"#333\"/><rect x=\"52\" y=\"152\" width=\"16\" height=\"8\" fill=\"#b8884a\" stroke=\"#333\"/><text x=\"60\" y=\"226\" text-anchor=\"middle\">4 Housing<\/text><rect x=\"135\" y=\"135\" width=\"20\" height=\"75\" fill=\"#c9a574\" stroke=\"#333\"/><rect x=\"155\" y=\"135\" width=\"50\" height=\"20\" fill=\"#d9b98a\" stroke=\"#333\"/><rect x=\"155\" y=\"190\" width=\"50\" height=\"20\" fill=\"#d9b98a\" stroke=\"#333\"/><rect x=\"155\" y=\"155\" width=\"50\" height=\"35\" fill=\"#d9b98a\" stroke=\"#333\"/><text x=\"170\" y=\"226\" text-anchor=\"middle\">5 Bridle<\/text><rect x=\"255\" y=\"140\" width=\"80\" height=\"18\" fill=\"#d9b98a\" stroke=\"#333\"/><rect x=\"285\" y=\"158\" width=\"20\" height=\"50\" fill=\"#d9b98a\" stroke=\"#333\"/><path d=\"M285 158h20\" stroke=\"#e8630a\" stroke-width=\"3\"/><text x=\"295\" y=\"226\" text-anchor=\"middle\">6 Tee halving<\/text><\/svg><\/div><table><tr><th>Joint<\/th><th>How to spot it<\/th><th>Use<\/th><\/tr><tr><td>Cross halving<\/td><td>Two pieces cross; half the thickness cut from each<\/td><td>Frames, stretchers<\/td><\/tr><tr><td>Mortise and tenon<\/td><td>Tongue on one piece fits a slot in the other<\/td><td>Doors, chairs, tables<\/td><\/tr><tr><td>Dovetail<\/td><td>Wedge-shaped fingers interlock<\/td><td>Drawers, boxes<\/td><\/tr><tr><td>Housing<\/td><td>Board sits in a groove cut across another<\/td><td>Shelves, racks<\/td><\/tr><tr><td>Bridle<\/td><td>Open slot on one piece, tongue on the other<\/td><td>Frame corners<\/td><\/tr><tr><td>Tee halving<\/td><td>End of one piece meets the middle of another, both notched<\/td><td>Frames<\/td><\/tr><\/table><p class=\"tip\">Drawn by me from standard woodwork practice. Send a clear photo of (i) and (iii) and I will name them exactly.<\/p>", "src": "past"}, {"id": 42, "t": 6, "l": "2013/14 Q4(d); 2014/15 Q1(j); 2017/18 Q1(j)", "q": "Name at least five (5) woodwork tools in the following classification: (i) hand tools, (ii) powered hand tools.", "o": [], "a": 0, "ans": "<p><b>Hand tools:<\/b> handsaw, tenon (back) saw, coping saw, bow saw, chisels (firmer, mortise, dovetail), jack plane, mallet, hammer, rasp, spokeshave, try square.<\/p><p><b>Powered hand tools:<\/b> drilling machine, jigsaw, circular saw, router, orbital sander, impact driver, nail gun, power plane, chain saw.<\/p>", "src": "past"}, {"id": 43, "t": 9, "l": "2013/14 Q2(d)", "q": "List five (5) safety precautions to be taken in the forging workshop.", "o": [], "a": 0, "ans": "<ol><li>Wear overalls, gloves, goggles and safety boots.<\/li><li>Carry hot work downwards, close to the ground.<\/li><li>Mark or label hot pieces so no one grabs them.<\/li><li>Use tongs that fit the work; do not hold hot metal by hand.<\/li><li>Check hammer heads are tight and handles unsplit.<\/li><li>Keep the striker clear of others and watch for flying scale.<\/li><li>Keep water and oil away from the hearth; keep floors clear.<\/li><\/ol>", "src": "past"}, {"id": 44, "t": 11, "l": "2013/14 Q1(e), Q2(e), Q3(e), Q4(e); 2014/15 Q1(k),(l)", "q": "(a) Identify the material of the coil winding of the stator of a fan. (b) List the two major components of a fan that contain a coil winding. (c) How is the stator coil commonly connected? (d) State the configuration of the stator of a CROWN fan.", "o": [], "a": 0, "ans": "<p class=\"tip\">Standard workshop knowledge, not in your uploaded slides. Confirm with your notes.<\/p><ol><li><b>Material:<\/b> enamelled (insulated) copper wire.<\/li><li><b>Components:<\/b> the <b>stator<\/b> (main winding) and the <b>regulator<\/b> (choke-coil type speed regulator). The rotor of a fan motor is a cage, not a coil.<\/li><li><b>Connection:<\/b> a single-phase fan has a <b>running (main) winding<\/b> and an <b>auxiliary (starting) winding<\/b> connected in parallel across the supply, with the auxiliary in series with a capacitor. Three-phase stators are connected <b>star (wye) or delta<\/b> (your 2018/19 solution).<\/li><li><b>CROWN fan stator:<\/b> running coil, starting (auxiliary) coil and a switch (speed) coil wound in the stator slots. Number of turns is not in your materials.<\/li><\/ol>", "src": "past"}, {"id": 45, "t": 12, "l": "2014/15 Q2(a),(b); 2017/18 Q2(a),(b)", "q": "What are the specific functions of safety devices in electric power distribution? List various types of safety devices.", "o": [], "a": 0, "ans": "<p class=\"tip\">Standard workshop knowledge, not in your uploaded slides. Confirm with your notes.<\/p><p><b>Functions:<\/b> protect people from shock; protect cables and equipment from overload and short circuit; isolate a faulty circuit so the rest keeps working; reduce fire risk.<\/p><p><b>Types:<\/b> fuses, miniature circuit breakers (MCB), moulded-case breakers, earth leakage / residual current devices (ELCB, RCD), earthing (grounding), isolators, overload relays, surge arresters.<\/p>", "src": "past"}, {"id": 46, "t": 12, "l": "2014/15 Q2(c); 2017/18 Q2(c)", "q": "What do you understand by \"short circuit\" as a problem in electric power distribution? List the problem(s) usually associated with the failure of insulation.", "o": [], "a": 0, "ans": "<p class=\"tip\">Standard workshop knowledge, not in your uploaded slides. Confirm with your notes.<\/p><p>A <b>short circuit<\/b> is an unwanted low-resistance path between live and neutral (or earth). Current becomes very large, causing heat, sparks, fire and damage; fuses or breakers should trip.<\/p><p><b>Insulation failure causes:<\/b> short circuit, earth fault and leakage current, electric shock, overheating and fire, burnt equipment, power loss.<\/p>", "src": "past"}, {"id": 47, "t": 12, "l": "2014/15 Q2(d); 2017/18 Q2(d)", "q": "What is electrocution? Highlight possible consequences of electrocution on human systems. What are the possible causes of electrocution?", "o": [], "a": 0, "ans": "<p class=\"tip\">Standard workshop knowledge, not in your uploaded slides. Confirm with your notes.<\/p><p><b>Electrocution<\/b> is injury or death caused by electric current passing through the body.<\/p><p><b>Effects:<\/b> burns, muscle spasm (cannot let go), breathing stops, irregular heartbeat or cardiac arrest, nerve damage, unconsciousness.<\/p><p><b>Causes:<\/b> touching live conductors, damaged or exposed cable insulation, no earthing, wet hands or floor, faulty tools, working on live circuits, overloaded wiring.<\/p>", "src": "past"}, {"id": 48, "t": 5, "l": "2014/15 Q3(a); 2017/18 Q3(a); 2018/19 Q2(a)", "q": "What is Welding? Name the types of welding.", "o": [], "a": 0, "ans": "<p>Welding is joining two or more parts (similar or different metals) with <b>heat, pressure, or both<\/b>. The joint is a weldment; the joined parts are the parent material; the added metal is the filler.<\/p><p><b>Types:<\/b> 1 arc welding, 2 oxy-fuel gas welding, 3 resistance welding, 4 solid-state welding (friction, diffusion, ultrasonic). Others: electron beam, laser.<\/p>", "src": "past"}, {"id": 49, "t": 5, "l": "2014/15 Q3(b),(c); 2017/18 Q3(b),(c)", "q": "State the range of current and voltage being used in arc welding. Critically highlight the principle of operation of arc welding.", "o": [], "a": 0, "ans": "<p><b>Range:<\/b> open-circuit voltage 50–90 V (a transformer steps mains of 200–400 V down to this); arc voltage about 20–40 V; current from about 50 A to 400 A depending on electrode size and metal.<p class=\"tip\">Open-circuit voltage is from your solutions; arc voltage and current ranges are standard values. Confirm with your notes.<\/p><\/p><p><b>Principle:<\/b><\/p><ol><li>The electrode touches the work then is lifted slightly, forming an arc.<\/li><li>The arc reaches about 5500°C and melts the base metal and the electrode.<\/li><li>Flux coating gives a gas shield and slag that protect the pool from air.<\/li><li>Molten metal solidifies as the electrode moves along the joint.<\/li><li>Chip off the slag with a chipping hammer and brush clean.<\/li><\/ol>", "src": "past"}, {"id": 50, "t": 5, "l": "2014/15 Q3(d); 2017/18 Q3(d)", "q": "What are the different types of weld joints that exist?", "o": [], "a": 0, "ans": "<ol><li><b>Butt<\/b> – edges meet in one plane.<\/li><li><b>Lap<\/b> – plates overlap.<\/li><li><b>Tee<\/b> – one plate stands at 90° on another.<\/li><li><b>Corner<\/b> – plates meet at an outside corner.<\/li><li><b>Edge<\/b> – edges of parallel plates are joined.<\/li><\/ol><div class=\"dg\"><svg viewBox=\"0 0 360 120\" font-family=\"sans-serif\" font-size=\"10\"><g transform=\"translate(0,0)\" stroke=\"#222\" fill=\"#bbb\"><rect x=\"2\" y=\"40\" width=\"30\" height=\"14\"/><rect x=\"36\" y=\"40\" width=\"30\" height=\"14\"/><rect x=\"30\" y=\"40\" width=\"8\" height=\"14\" fill=\"#e8630a\"/><text x=\"14\" y=\"104\" fill=\"#111\" stroke=\"none\">Butt<\/text><\/g><g transform=\"translate(72,0)\" stroke=\"#222\" fill=\"#bbb\"><rect x=\"2\" y=\"30\" width=\"44\" height=\"12\"/><rect x=\"22\" y=\"42\" width=\"44\" height=\"12\"/><path d=\"M46 42l6 0-6 6z\" fill=\"#e8630a\"/><text x=\"14\" y=\"104\" fill=\"#111\" stroke=\"none\">Lap<\/text><\/g><g transform=\"translate(144,0)\" stroke=\"#222\" fill=\"#bbb\"><rect x=\"2\" y=\"64\" width=\"64\" height=\"12\"/><rect x=\"28\" y=\"20\" width=\"12\" height=\"44\"/><path d=\"M28 64l-8 0 8-8zM40 64l8 0-8-8z\" fill=\"#e8630a\"/><text x=\"14\" y=\"104\" fill=\"#111\" stroke=\"none\">Tee<\/text><\/g><g transform=\"translate(216,0)\" stroke=\"#222\" fill=\"#bbb\"><rect x=\"6\" y=\"64\" width=\"50\" height=\"12\"/><rect x=\"6\" y=\"20\" width=\"12\" height=\"44\"/><path d=\"M18 64h8l-8-8z\" fill=\"#e8630a\"/><text x=\"14\" y=\"104\" fill=\"#111\" stroke=\"none\">Corner<\/text><\/g><g transform=\"translate(288,0)\" stroke=\"#222\" fill=\"#bbb\"><rect x=\"14\" y=\"20\" width=\"12\" height=\"52\"/><rect x=\"26\" y=\"20\" width=\"12\" height=\"52\"/><rect x=\"14\" y=\"16\" width=\"24\" height=\"5\" fill=\"#e8630a\"/><text x=\"14\" y=\"104\" fill=\"#111\" stroke=\"none\">Edge<\/text><\/g><\/svg><\/div><p class=\"tip\"><b>Exam-hall tip:<\/b> Draw each with a ruler; show weld metal as shaded areas.<\/p>", "src": "past"}, {"id": 51, "t": 5, "l": "2018/19 Q2(c),(d)", "q": "Name the types of electrodes and the factors that influence the choice of power source.", "o": [], "a": 0, "ans": "<p><b>Electrodes:<\/b> consumable (bare, coated; melt and act as filler) and non-consumable (carbon/graphite, tungsten; filler added separately).<\/p><p><b>Power source:<\/b> DC from generators (engine-driven if no mains) or AC from transformers. Choose by electrode and metal type, available supply, required output, duty cycle, efficiency, cost, floor space and versatility.<\/p>", "src": "past"}, {"id": 52, "t": 2, "l": "2018/19 Q4", "q": "Wood pattern: state its advantages, disadvantages and the types of pattern.", "o": [], "a": 0, "ans": "<p><b>Advantages:<\/b> cheap, plentiful, light, easy to shape and repair, smooth finish.<\/p><p><b>Disadvantages:<\/b> absorbs moisture and warps; changes shape; wears faster than metal in sand.<\/p><p><b>Types:<\/b> single-piece (solid), split (two-piece), multi-piece, match-plate, cope and drag, loose piece, skeleton, sweep, shell. <b>Materials:<\/b> wood, plastic, plaster of Paris, wax, metals.<\/p>", "src": "past"}, {"id": 53, "t": 0, "l": "2018/19 Q1(a),(b)", "q": "Define workshop practice and list the stages of metal production.", "o": [], "a": 0, "ans": "<p>Workshop practice is the set of skills, techniques and procedures for working with tools and equipment (machining, welding, woodwork, fabrication, etc.). It builds the technical hand skills used in industry.<\/p><p><b>Metal production stages:<\/b> mining, crushing and screening, blending and beneficiation, sintering or pelletizing, smelting, refining, shaping and forming, finishing.<\/p>", "src": "past"}, {"id": 54, "t": 2, "l": "Practice sheet: Foundry", "q": "Discuss the sections of a foundry. What is mulling? List the types of moulding and the moulding tools.", "o": [], "a": 0, "ans": "<p><b>Sections:<\/b> pattern making, moulding, melting and pouring, fettling/finishing and heat treatment.<\/p><p><b>Mulling:<\/b> mixing and kneading sand, binder and water in a muller to give an even green sand.<\/p><p><b>Moulding types:<\/b> green sand, dry sand, loam, shell, CO₂.<\/p><p><b>Tools:<\/b> rammer, riddle/sieve, strike-off bar, vent wire, draw spike, sprue and riser pins, trowel, slick, moulding flask (cope and drag), surface board, ladle, tongs.<\/p>", "src": "test"}, {"id": 55, "t": 5, "l": "Practice sheet: Welding", "q": "Discuss four tools and equipment employed in the welding workshop, and list the four types of welding.", "o": [], "a": 0, "ans": "<ul><li>Arc welding machine – supplies the arc current.<\/li><li>Electrode holder and earth clamp – carry current to the electrode and work.<\/li><li>Welding helmet or hand shield – protects eyes and face from UV and sparks.<\/li><li>Chipping hammer and wire brush – remove and clean slag.<\/li><\/ul><p>Types: arc, oxy-fuel gas, resistance, solid-state.<\/p>", "src": "test"}, {"id": 56, "t": 7, "l": "Practice sheet: Fitting", "q": "What is fitting? Discuss the four basic operations and list ten fitting hand tools.", "o": [], "a": 0, "ans": "<p>Fitting is shaping and assembling metal parts with hand tools on the bench so they fit together accurately.<\/p><p><b>Four operations:<\/b> 1 marking out (scriber, rule, punch), 2 cutting (hacksaw, chisel), 3 filing (smoothing to size), 4 drilling and threading (drill, tap, die).<\/p><p><b>Ten tools:<\/b> bench vice, hacksaw, files, cold chisel, ball-pein hammer, scriber, centre punch, try square, steel rule, vernier caliper (also taps and dies).<\/p>", "src": "test"}, {"id": 57, "t": 11, "l": "Practice sheet: Rewinding", "q": "Define rewinding. Give four ways to detect a burnt coil, seven tools and six materials.", "o": [], "a": 0, "ans": "<p class=\"tip\">Standard workshop knowledge, not in your uploaded slides. Confirm with your notes.<\/p><p><b>Rewinding<\/b> is replacing a burnt or faulty motor or fan winding with new coils.<\/p><p><b>Detect a burnt coil:<\/b> burnt smell; dark or brittle insulation; open circuit on a multimeter; insulation resistance test shows a short to the frame; fan hums or runs hot.<\/p><p><b>Tools:<\/b> winding machine and former, pliers, side cutter, soldering iron, multimeter, screwdriver, mallet.<\/p><p><b>Materials:<\/b> enamelled copper wire, insulating paper, sleeving, varnish, insulating tape, lacing cord, solder.<\/p><p>The turns per coil are not given in your materials.<\/p>", "src": "test"}, {"id": 58, "t": 6, "l": "Practice sheet: Woodwork", "q": "Give examples of holding and supporting, paring and cutting, percussion and impelling, and abrading and scraping tools. What are portable power tools and how do they differ from machines?", "o": [], "a": 0, "ans": "<ul><li><b>Holding/supporting:<\/b> bench, vice, cramps, bench hook, trestle.<\/li><li><b>Paring/cutting:<\/b> chisels, planes, saws, gouges.<\/li><li><b>Percussion/impelling:<\/b> hammer, mallet, screwdriver, brace.<\/li><li><b>Abrading/scraping:<\/b> rasp, files, glasspaper, scraper, spokeshave.<\/li><\/ul><p><b>Portable power tools<\/b> are hand-held and electric (drill, jigsaw, router, sander). <b>Machines<\/b> are fixed, heavier and more powerful (bandsaw, lathe, planer).<\/p>", "src": "test"}, {"id": 59, "t": 9, "l": "Practice sheet: Forging", "q": "Which type of forging is the oldest plastic deformation process? What is hand forging (blacksmithing)?", "o": [], "a": 0, "ans": "<p>Types: open-die, closed-die, flashless (precision), and <b>hand forging (blacksmithing)<\/b>, the oldest of all plastic deformation processes.<\/p><p>Hand forging is shaping metal by plastic deformation under impact pressure using hand tools. In Nigeria blacksmiths (Ojogun) make farm and hunting tools.<\/p>", "src": "test"}, {"id": 60, "t": 0, "l": "Practice sheet: Metal Machining", "q": "Discuss three classifications of lathe machine and sketch the five basic lathe operations.", "o": [], "a": 0, "ans": "<p class=\"tip\">Standard workshop knowledge, not in your uploaded slides. Confirm with your notes.<\/p><p><b>Classifications:<\/b> 1 centre (engine) lathe, general work; 2 turret/capstan lathe, repeat jobs with several tools; 3 automatic/CNC lathe, programmed production. (Also bench and speed lathes.)<\/p><p><b>Five operations:<\/b> turning, facing, taper turning, threading, drilling/boring.<\/p><div class=\"dg\"><svg viewBox=\"0 0 360 120\" font-family=\"sans-serif\" font-size=\"10\"><defs><marker id=\"a\" markerWidth=\"6\" markerHeight=\"6\" refX=\"5\" refY=\"3\" orient=\"auto\"><path d=\"M0 0l6 3-6 3z\" fill=\"#e8630a\"/><\/marker><\/defs><g transform=\"translate(0,0)\"><rect x=\"6\" y=\"46\" width=\"56\" height=\"26\" fill=\"#bbb\" stroke=\"#222\"/><path d=\"M10 38h46\" stroke=\"#e8630a\" stroke-width=\"2\" marker-end=\"url(#a)\"/><text x=\"6\" y=\"108\">Turning<\/text><\/g><g transform=\"translate(72,0)\"><rect x=\"6\" y=\"46\" width=\"56\" height=\"26\" fill=\"#bbb\" stroke=\"#222\"/><path d=\"M70 28v36\" stroke=\"#e8630a\" stroke-width=\"2\" marker-end=\"url(#a)\"/><text x=\"6\" y=\"108\">Facing<\/text><\/g><g transform=\"translate(144,0)\"><rect x=\"6\" y=\"46\" width=\"56\" height=\"26\" fill=\"#bbb\" stroke=\"#222\"/><path d=\"M10 30l46 14\" stroke=\"#e8630a\" stroke-width=\"2\" marker-end=\"url(#a)\"/><text x=\"6\" y=\"108\">Taper<\/text><\/g><g transform=\"translate(216,0)\"><rect x=\"6\" y=\"46\" width=\"56\" height=\"26\" fill=\"#bbb\" stroke=\"#222\"/><path d=\"M10 46l6 26 6-26 6 26 6-26 6 26\" stroke=\"#e8630a\" fill=\"none\" stroke-width=\"2\"/><text x=\"6\" y=\"108\">Threading<\/text><\/g><g transform=\"translate(288,0)\"><rect x=\"6\" y=\"46\" width=\"56\" height=\"26\" fill=\"#bbb\" stroke=\"#222\"/><path d=\"M70 59H34\" stroke=\"#e8630a\" stroke-width=\"3\" marker-end=\"url(#a)\"/><text x=\"6\" y=\"108\">Drilling<\/text><\/g><\/svg><\/div><p class=\"tip\"><b>Exam-hall tip:<\/b> Draw each stage with the workpiece and an arrow for the tool direction. Label every operation.<\/p>", "src": "test"}, {"id": 61, "t": 5, "l": "2018/19 Q2(b)", "q": "Sketch and label the arc welding equipment circuit.", "o": [], "a": 0, "ans": "<p>Current flows from the power source, through the electrode cable and holder, across the arc to the workpiece, and back through the earth clamp and cable.<\/p><div class=\"dg\"><svg viewBox=\"0 0 360 200\" font-family=\"sans-serif\" font-size=\"10\"><rect x=\"10\" y=\"60\" width=\"80\" height=\"70\" rx=\"6\" fill=\"#ddd\" stroke=\"#222\"/><text x=\"50\" y=\"92\" text-anchor=\"middle\">Power<\/text><text x=\"50\" y=\"106\" text-anchor=\"middle\">source<\/text><path d=\"M90 78h120l30-14\" fill=\"none\" stroke=\"#e8630a\" stroke-width=\"3\"/><rect x=\"236\" y=\"40\" width=\"40\" height=\"14\" fill=\"#555\" transform=\"rotate(-25 256 47)\"/><path d=\"M262 52l22 40\" stroke=\"#222\" stroke-width=\"3\"/><path d=\"M284 92l-4 8 8-4 -4 8\" fill=\"none\" stroke=\"#f5a000\" stroke-width=\"2\"/><rect x=\"190\" y=\"104\" width=\"150\" height=\"14\" fill=\"#9aa\" stroke=\"#222\"/><rect x=\"190\" y=\"118\" width=\"150\" height=\"10\" fill=\"#777\"/><path d=\"M90 112h60v62h130v-46\" fill=\"none\" stroke=\"#e8630a\" stroke-width=\"3\"/><rect x=\"274\" y=\"122\" width=\"14\" height=\"10\" fill=\"#222\"/><text x=\"150\" y=\"22\">Electrode cable<\/text><path d=\"M170 26l26 22\" stroke=\"#222\"/><text x=\"286\" y=\"34\">Electrode holder<\/text><text x=\"292\" y=\"86\">Electrode<\/text><text x=\"300\" y=\"100\">Arc<\/text><text x=\"196\" y=\"148\">Workpiece<\/text><text x=\"130\" y=\"188\">Earth (return) cable + earth clamp<\/text><text x=\"10\" y=\"30\">Mains supply<\/text><path d=\"M30 34v24\" stroke=\"#222\"/><\/svg><\/div><ul><li><b>Power source:<\/b> AC transformer or DC generator.<\/li><li><b>Electrode holder:<\/b> grips the electrode and carries current.<\/li><li><b>Earth clamp and cable:<\/b> completes the circuit.<\/li><li><b>Also needed:<\/b> helmet or hand shield, chipping hammer, wire brush, gloves, apron.<\/li><\/ul><p class=\"tip\">Diagram drawn from standard arc welding layout. Confirm with your 2018/19 solutions.<\/p>", "src": "past"}, {"id": 62, "t": 2, "l": "Likely exam question", "q": "Define sand casting. Describe the steps, and state its advantages, disadvantages and uses.", "o": [], "a": 0, "ans": "<p>Sand casting is pouring molten metal into a cavity made in moulding sand, letting it solidify, then breaking out the casting.<\/p><ol><li>Make the pattern (with allowances).<\/li><li>Prepare the moulding sand.<\/li><li>Ram sand round the pattern in the cope and drag.<\/li><li>Remove the pattern; cut sprue, runner, gate and riser.<\/li><li>Fit the cores and close the mould.<\/li><li>Melt the metal and pour.<\/li><li>Let it solidify, then shake out.<\/li><li>Fettle (clean) and inspect.<\/li><\/ol><p><b>Advantages:<\/b> cheap, any size or metal, complex shapes, sand can be reused. <b>Disadvantages:<\/b> rough surface, poor accuracy, mould is used once, needs machining. <b>Uses:<\/b> engine blocks, pipes, machine beds, pulleys.<\/p>", "src": "prac"}, {"id": 63, "t": 2, "l": "Likely exam question", "q": "With a labelled diagram, show the parts of a sand mould and the gating system.", "o": [], "a": 0, "ans": "<p>Name and state the function of each part:<\/p><ul><li><b>Cope / drag:<\/b> upper and lower mould halves (flask).<\/li><li><b>Parting line:<\/b> where the two halves meet.<\/li><li><b>Pouring basin and sprue:<\/b> receive and carry metal down.<\/li><li><b>Runner and gate:<\/b> lead metal into the cavity.<\/li><li><b>Riser:<\/b> a metal reservoir that feeds shrinkage and shows the mould is full.<\/li><li><b>Core:<\/b> forms holes and hollow parts.<\/li><li><b>Vents:<\/b> let gases escape.<\/li><\/ul><div class=\"dg\"><svg viewBox=\"0 0 360 200\" font-family=\"sans-serif\" font-size=\"10\"><rect x=\"20\" y=\"20\" width=\"250\" height=\"70\" fill=\"#e9d9b8\" stroke=\"#333\"/><rect x=\"20\" y=\"90\" width=\"250\" height=\"80\" fill=\"#d2bd94\" stroke=\"#333\"/><path d=\"M20 90h250\" stroke=\"#e8630a\" stroke-dasharray=\"5 3\" stroke-width=\"2\"/><rect x=\"120\" y=\"110\" width=\"80\" height=\"30\" fill=\"#fff\" stroke=\"#333\"/><rect x=\"150\" y=\"96\" width=\"20\" height=\"14\" fill=\"#999\" stroke=\"#333\"/><rect x=\"40\" y=\"20\" width=\"36\" height=\"150\" fill=\"#fff\" stroke=\"#333\" opacity=\".001\"/><path d=\"M60 10h30l-6 22h-18z\" fill=\"#fff\" stroke=\"#333\"/><rect x=\"70\" y=\"32\" width=\"10\" height=\"68\" fill=\"#fff\" stroke=\"#333\"/><rect x=\"70\" y=\"100\" width=\"50\" height=\"8\" fill=\"#fff\" stroke=\"#333\"/><rect x=\"226\" y=\"40\" width=\"22\" height=\"66\" fill=\"#fff\" stroke=\"#333\"/><text x=\"280\" y=\"40\">Cope<\/text><text x=\"280\" y=\"140\">Drag<\/text><text x=\"280\" y=\"92\" fill=\"#e8630a\">Parting line<\/text><text x=\"30\" y=\"8\">Pouring basin<\/text><text x=\"84\" y=\"64\">Sprue<\/text><text x=\"74\" y=\"124\">Runner<\/text><text x=\"120\" y=\"156\">Mould cavity<\/text><text x=\"148\" y=\"94\">Core<\/text><text x=\"206\" y=\"34\">Riser<\/text><text x=\"20\" y=\"190\">Gate joins runner to cavity; vents let gases escape<\/text><\/svg><\/div>", "src": "prac"}, {"id": 64, "t": 2, "l": "Likely exam question", "q": "List the types of moulding sand and the properties a good moulding sand must have.", "o": [], "a": 0, "ans": "<table><tr><th>Type<\/th><th>Note<\/th><\/tr><tr><td>Green sand<\/td><td>Moist; most common<\/td><\/tr><tr><td>Dry sand<\/td><td>Baked; for large castings<\/td><\/tr><tr><td>Loam sand<\/td><td>Clay-rich; very big work<\/td><\/tr><tr><td>Facing sand<\/td><td>Fine; next to the pattern for smooth finish<\/td><\/tr><tr><td>Parting sand<\/td><td>Dry, stops cope and drag sticking<\/td><\/tr><tr><td>Core sand<\/td><td>Sand with binder for cores<\/td><\/tr><\/table><p><b>Properties:<\/b> permeability (lets gas out), cohesiveness (holds shape), refractoriness (resists heat), flowability, collapsibility (lets the casting shrink), adhesiveness.<\/p>", "src": "prac"}, {"id": 65, "t": 2, "l": "Likely exam question", "q": "State the types of pattern and the pattern allowances.", "o": [], "a": 0, "ans": "<p><b>Types:<\/b> solid (single piece), split, loose piece, match plate, gated, sweep, skeleton, cope and drag.<\/p><p><b>Allowances:<\/b><\/p><ul><li><b>Shrinkage:<\/b> metal contracts as it cools, so the pattern is made larger.<\/li><li><b>Draft:<\/b> slight taper so the pattern lifts out cleanly.<\/li><li><b>Machining:<\/b> extra metal for finishing.<\/li><li><b>Rapping (shake):<\/b> pattern is loosened by tapping, so the cavity grows slightly.<\/li><li><b>Distortion:<\/b> allowance for warping shapes such as U or V.<\/li><\/ul>", "src": "prac"}, {"id": 66, "t": 2, "l": "Likely exam question", "q": "What is die casting? Describe the process, metals used, advantages and limits.", "o": [], "a": 0, "ans": "<p>Die casting forces molten metal into a steel die (mould) under high pressure. The metal solidifies and the die opens to eject the part.<\/p><ol><li>Close and clamp the die.<\/li><li>Inject the molten metal under pressure.<\/li><li>Hold pressure while it solidifies.<\/li><li>Open the die and eject the casting; trim the flash.<\/li><\/ol><p><b>Metals:<\/b> zinc, aluminium, magnesium, copper alloys, lead and tin. <b>Advantages:<\/b> fast, accurate, smooth finish, thin walls, little machining. <b>Limits:<\/b> costly dies, only suits large volumes and low-melting metals, size is limited. <b>Uses:<\/b> carburettor bodies, gearbox housings, toys, door handles.<\/p>", "src": "prac"}, {"id": 67, "t": 2, "l": "Likely exam question", "q": "Name other casting processes and state the principle of each.", "o": [], "a": 0, "ans": "<table><tr><th>Process<\/th><th>Principle<\/th><th>Uses<\/th><\/tr><tr><td>Investment (lost wax)<\/td><td>Wax pattern coated in ceramic, wax melted out<\/td><td>Jewellery, turbine blades<\/td><\/tr><tr><td>Shell moulding<\/td><td>Thin resin-sand shell on a hot pattern<\/td><td>Gears, small parts<\/td><\/tr><tr><td>Centrifugal<\/td><td>Mould spun so metal is thrown outward<\/td><td>Pipes, bushes<\/td><\/tr><tr><td>Permanent mould<\/td><td>Metal mould filled by gravity<\/td><td>Pistons, wheels<\/td><\/tr><tr><td>Continuous<\/td><td>Metal poured and drawn out as a bar<\/td><td>Billets, slabs<\/td><\/tr><\/table>", "src": "prac"}, {"id": 68, "t": 2, "l": "Likely exam question", "q": "Describe the cupola furnace and other furnaces used in a foundry.", "o": [], "a": 0, "ans": "<p><b>Cupola:<\/b> a vertical steel shell lined with firebrick, used to melt cast iron. Charge in layers: <b>coke<\/b> (fuel), <b>pig iron and scrap<\/b> (metal), <b>limestone<\/b> (flux that removes impurities as slag). Air blows in through tuyeres near the bottom; molten iron is tapped out at the front and slag is drawn off.<\/p><ul><li><b>Crucible furnace:<\/b> pit or tilting type; melts non-ferrous metals such as aluminium and brass.<\/li><li><b>Electric arc and induction furnaces:<\/b> clean, accurate temperature; for steel and alloys.<\/li><li><b>Reverberatory furnace:<\/b> flame passes over the charge; for large batches.<\/li><\/ul>", "src": "prac"}, {"id": 69, "t": 2, "l": "Likely exam question", "q": "List common casting defects with their causes and remedies.", "o": [], "a": 0, "ans": "<table><tr><th>Defect<\/th><th>Cause<\/th><th>Remedy<\/th><\/tr><tr><td>Blowholes / porosity<\/td><td>Trapped gas, wet sand<\/td><td>Better venting, dry sand<\/td><\/tr><tr><td>Shrinkage cavity<\/td><td>No feed metal<\/td><td>Proper riser<\/td><\/tr><tr><td>Misrun<\/td><td>Metal too cold or slow pouring<\/td><td>Higher pouring temperature<\/td><\/tr><tr><td>Cold shut<\/td><td>Two streams meet and do not fuse<\/td><td>Better gating<\/td><\/tr><tr><td>Hot tear<\/td><td>Restrained shrinkage<\/td><td>Collapsible sand, better design<\/td><\/tr><tr><td>Sand inclusion<\/td><td>Loose sand washed in<\/td><td>Firm ramming, clean mould<\/td><\/tr><tr><td>Mould shift<\/td><td>Cope and drag misaligned<\/td><td>Use alignment pins<\/td><\/tr><\/table>", "src": "prac"}, {"id": 70, "t": 2, "l": "Likely exam question", "q": "What is a core? State its types and the purpose of core prints and chaplets.", "o": [], "a": 0, "ans": "<p>A core is a baked sand shape placed in the mould to form holes or hollow spaces in the casting.<\/p><p><b>Types:<\/b> horizontal, vertical, balanced, hanging, drop and green-sand cores.<\/p><ul><li><b>Core print:<\/b> an extension on the pattern that makes a seat to hold the core.<\/li><li><b>Chaplet:<\/b> a metal support that holds the core steady against the weight of metal; it melts into the casting.<\/li><\/ul><p>Core sand needs high strength, permeability and collapsibility.<\/p>", "src": "prac"}, {"id": 71, "t": 2, "l": "Likely exam question", "q": "Name the hand tools used in the foundry and state their uses.", "o": [], "a": 0, "ans": "<table><tr><th>Tool<\/th><th>Use<\/th><\/tr><tr><td>Riddle<\/td><td>Sieves sand<\/td><\/tr><tr><td>Shovel<\/td><td>Mixes and moves sand<\/td><\/tr><tr><td>Rammer<\/td><td>Packs sand round the pattern<\/td><\/tr><tr><td>Strike-off bar<\/td><td>Levels sand at the flask top<\/td><\/tr><tr><td>Vent wire<\/td><td>Pricks vent holes<\/td><\/tr><tr><td>Sleeker, trowel, lifter<\/td><td>Smooth and repair the mould<\/td><\/tr><tr><td>Draw spike<\/td><td>Lifts the pattern out<\/td><\/tr><tr><td>Gate cutter<\/td><td>Cuts sprue and runner<\/td><\/tr><tr><td>Swab<\/td><td>Wets sand round the pattern<\/td><\/tr><tr><td>Bellows<\/td><td>Blows loose sand out<\/td><\/tr><\/table>", "src": "prac"}, {"id": 72, "t": 2, "l": "Likely exam question", "q": "Explain fettling and the methods of inspecting castings.", "o": [], "a": 0, "ans": "<p><b>Fettling<\/b> is cleaning the casting after shakeout:<\/p><ol><li>Knock off sand.<\/li><li>Cut off gates, runners and risers.<\/li><li>Grind away flash and rough spots.<\/li><li>Shot-blast the surface.<\/li><li>Heat treat if needed.<\/li><\/ol><p><b>Inspection:<\/b> visual and dimensional checks, pressure (leak) test, dye penetrant for surface cracks, magnetic particle, ultrasonic and X-ray (radiography) for inside flaws.<\/p>", "src": "prac"}], "rep": []};
