ternary hydrocarbon"], "a": 0}, {"id": 3, "t": 0, "l": "Exam Q54", "q": "1-methyl cyclohexanol is a _______ alcohol", "o": ["primary alcohol", "secondary alcohol", "Tertiary alcohol", "Quaternary alcohol"], "a": 2}, {"id": 4, "t": 0, "l": "Exam Q93", "q": "Which of the following is a primary alcohol", "o": ["CH3–CH2–OH", "(CH3)2CH–OH", "(CH3)3C–OH", "C6H5–OH"], "a": 0}, {"id": 5, "t": 0, "l": "Exam Q94", "q": "Oxidation of a primary alcohol with acidified K2Cr2O7 produces", "o": ["Aldehyde", "Ketone", "Carboxylic acid", "Ester"], "a": 2}, {"id": 6, "t": 0, "l": "Test Q10", "q": "The oxidation of a secondary alkanol always produces a", "o": ["Alkanoic acid", "Alkanal", "Alkanone", "Alkene"], "a": 2}, {"id": 7, "t": 0, "l": "Test Q11", "q": "Which compound shows hydrogen bonding between its molecules but does not form ions in water", "o": ["Ethanoic acid", "Ethanol", "Sodium ethanoate", "Ethyl ethanoate"], "a": 1}, {"id": 8, "t": 0, "l": "Test Q12", "q": "Which compound will react with sodium metal but not with sodium hydrogen carbonate", "o": ["Ethanol", "Ethanoic acid", "Phenol", "Ethanal"], "a": 0}, {"id": 9, "t": 0, "l": "Test Q18", "q": "Which reaction converts an alkene directly to an alkanol", "o": ["Dehydration", "Hydrogenation", "Hydration", "Oxidation"], "a": 2}, {"id": 10, "t": 0, "l": "Test Q23", "q": "Which transformation involves oxidation, increase in oxidation number, and no carbon–carbon bond breaking", "o": ["Ethanol -> ethene", "Ethanol -> ethanal", "Ethanal -> ethene", "Ethanoic acid -> methane"], "a": 1}, {"id": 11, "t": 0, "l": "Test Q27", "q": "Which property increases most noticeably when moving from alkanes -> alkanols -> alkanoic acids", "o": ["Volatility", "Acidity", "Unsaturation", "Molecular mass"], "a": 1}, {"id": 12, "t": 0, "l": "Test Q50", "q": "Oxidation of methyl-ethanol (propan-2-ol) with acidified K2Cr2O7 results in", "o": ["Propanal", "Propanone", "Propanoic acid and propanone", "None of the above"], "a": 1, "ns": 1}, {"id": 13, "t": 0, "l": "Test Q59", "q": "Cyclopropanol is a ----- alcohol", "o": ["Primary", "Secondary", "Tertiary", "Quaternary"], "a": 1, "rep": 1}, {"id": 14, "t": 0, "l": "Alcohols Q1", "q": "What are the two principal ways of obtaining simple alcohols?", "o": ["Hydrolysis of esters and oxidation of alkanes", "Reduction of carboxylic acids and halogenation of alkenes", "Hydration of alkenes, and hydrolysis (nucleophilic substitution) of alkyl halides", "Dehydration of ethers and oxidation of ketones"], "a": 2}, {"id": 15, "t": 0, "l": "Alcohols Q2", "q": "Direct addition of water to an alkene will give:", "o": ["alkanes", "aldehydes", "ethers", "alcohols"], "a": 3}, {"id": 16, "t": 0, "l": "Alcohols Q3", "q": "The reagent which could distinguish between 2,2-dimethyl-1-propanol and 2-methyl-2-butanol is:", "o": ["NaOH", "K₂Cr₂O₇", "NaHCO₃", "HCl"], "a": 1}, {"id": 17, "t": 0, "l": "Alcohols Q4", "q": "Which is a primary alcohol?", "o": ["CH₃CH₂OH", "(CH₃)₂CHOH", "(CH₃)₃COH", "C₆H₅OH"], "a": 0}, {"id": 18, "t": 0, "l": "Alcohols Q5", "q": "Ethanoic acid can be distinguished from phenol by reacting with:", "o": ["FeCl₃", "NaOH", "NaHCO₃", "Na metal"], "a": 2}, {"id": 19, "t": 0, "l": "Alcohols Q6", "q": "Draw (write) the structures of ethanol, t-butyl alcohol, cyclohexanol, 2-buten-1-ol and allyl alcohol.", "o": ["CH₃OH; CH₃CH₂OH; C₆H₅OH; CH₃CH=CHOH; CH₃CH=CH₂", "CH₃CH₂OH; (CH₃)₃COH; C₆H₁₁OH (a cyclohexane ring with one OH); CH₃CH=CHCH₂OH; CH₂=CHCH₂OH", "CH₃CH₂OH; (CH₃)₂CHOH; C₆H₅OH; CH₂=CHCH₂OH; CH₃CH=CHCH₂OH", "CH₃CH₂CH₂OH; (CH₃)₃COH; C₆H₁₁OH; CH₃CH=CHOH; CH₂=CHOH"], "a": 1}, {"id": 20, "t": 0, "l": "Alcohols Q7", "q": "Excess ethanol + conc. H₂SO₄ at 140°C produces:", "o": ["Ethene", "Diethyl ether", "Ethyl hydrogen sulfate", "Ethane"], "a": 1}, {"id": 21, "t": 0, "l": "Alcohols Q8", "q": "Hydrogenation of aldehydes produces primary alcohols while ketones yield secondary alcohols. True or False?", "o": ["False, both give primary alcohols", "False, aldehydes give secondary alcohols", "True", "False, ketones yield tertiary alcohols"], "a": 2, "ns": 1}, {"id": 22, "t": 0, "l": "Alcohols Q9", "q": "Oxidation of 4-methyl-1-pentanol with acidified sodium chromate gives:", "o": ["4-methylpentanoic acid", "4-methylpentanal", "4-methyl-2-pentanone", "2-methylpentanoic acid"], "a": 0}, {"id": 23, "t": 0, "l": "Alcohols Q10", "q": "Oxidation of methylethanol (propan-1-ol) with acidified K₂Cr₂O₇ results in?", "o": ["propanone", "propanal", "propanoic acid", "propene"], "a": 2}, {"id": 24, "t": 0, "l": "Alcohols Q11", "q": "The general formula for an alkanol is CₙH₂ₙ₊₁OH, or ROH where R is an alkyl or substituted alkyl group. True or False?", "o": ["False", "True"], "a": 1}, {"id": 25, "t": 0, "l": "Alcohols Q12", "q": "Hydroboration of 3,3-dimethyl-1-butene, followed by oxidation with H₂O₂, leads to the formation of:", "o": ["3,3-dimethyl-2-butanol", "3,3-dimethyl-1-butanol", "2,3-dimethyl-2-butanol", "2,3-dimethyl-1-butanol"], "a": 1}, {"id": 26, "t": 0, "l": "Alcohols Q13", "q": "Reacts with Methyl Magnesium Bromide to give a primary alcohol:", "o": ["Acetaldehyde", "Acetone", "Formaldehyde", "Propanal"], "a": 2}, {"id": 27, "t": 0, "l": "Alcohols Q14", "q": "Use an equation to show the hydroboration and oxidation of an alkene.", "o": ["CH₃CH=CH₂ + H₂O/H⁺ → CH₃CH(OH)CH₃", "CH₃CH=CH₂ with BH₃ in ether gives the alkylborane, and H₂O₂ with NaOH then gives CH₃CH₂CH₂OH, propan-1-ol", "CH₃CH=CH₂ + KMnO₄ → CH₃CH(OH)CH₂OH", "CH₃CH=CH₂ + HBr → CH₃CHBrCH₃"], "a": 1}, {"id": 28, "t": 0, "l": "Alcohols Q15", "q": "The action of an enzyme (zymase from yeast) on glucose will give:", "o": ["methanol and carbon dioxide", "ethanol and oxygen", "ethanol and carbon dioxide", "ethanoic acid and water"], "a": 2}, {"id": 29, "t": 0, "l": "Alcohols Q16", "q": "Cyclopropanol is a ___ alcohol?", "o": ["primary", "secondary", "tertiary", "quaternary"], "a": 1, "rep": 1}, {"id": 30, "t": 0, "l": "Alcohols Q17", "q": "Oxidation of ____ alcohols would yield carboxylic acids.", "o": ["tertiary", "secondary", "quaternary", "primary"], "a": 3}, {"id": 31, "t": 0, "l": "Alcohols Q18", "q": "Compounds having a hydroxyl group attached directly to an aromatic ring are known as:", "o": ["alkanols", "phenols", "ethers", "enols"], "a": 1}, {"id": 32, "t": 0, "l": "Alcohols Q19", "q": "Distinguish between 2-butanol (2°) and 2-methyl-2-propanol (3°):", "o": ["NaHCO₃", "K₂Cr₂O₇", "NaOH", "AgNO₃"], "a": 1}, {"id": 33, "t": 0, "l": "Alcohols Q20", "q": "Which is the most likely product in the acid catalysed hydration of 3-methyl-1-butene?", "o": ["2-methyl-2-butanol", "3-methyl-2-butanol", "3-methyl-1-butanol", "2-methyl-1-butanol"], "a": 0}, {"id": 34, "t": 1, "l": "Exam Q28", "q": "The reaction of butanol with iodo propane will give ______ ether", "o": ["Dibutyl", "Propylbutyl", "Butylpropyl", "Dipropyl"], "a": 2}, {"id": 35, "t": 1, "l": "Exam Q30", "q": "(CH3–O–CH2–CH2–CH3 + HI (conc)) in excess acid will yield", "o": ["C3H7I and IC3H7", "CH3I and IC3H7", "C2H5I and IC3H7", "C2H5I and IC2H5"], "a": 1}, {"id": 36, "t": 1, "l": "Exam Q96", "q": "Ethers are commonly prepared by", "o": ["Dehydration of alcohols", "Oxidation of alkanes", "Reduction of aldehydes", "Hydrolysis of esters"], "a": 0}, {"id": 37, "t": 1, "l": "Test Q17", "q": "Which compound will give a sweet smell, does not undergo oxidation, and contains oxygen", "o": ["Ethanol", "Ethanoic acid", "Dimethyl ether", "Ethanal"], "a": 2}, {"id": 38, "t": 1, "l": "Test Q24", "q": "Which compound has a planar functional group region", "o": ["Alkanes", "Alkanols", "Alkanals", "Alkoxyalkanes"], "a": 2}, {"id": 39, "t": 1, "l": "Test Q53", "q": "Given the reaction CH3OCH2CH3 + conc. HI (excess), the products are", "o": ["CH3I and IC2H5", "CH3I and IC3H7", "C2H5I and C2H5I", "C4H9I and IC4H9"], "a": 0}, {"id": 40, "t": 1, "l": "Test Q62", "q": "The reaction of butanol with iodopropane gives", "o": ["Dibutyl ether", "Dipropyl ether", "Butyl propyl ether", "Propyl butyl ether"], "a": 2}, {"id": 41, "t": 1, "l": "Ethers Q1", "q": "Which ether is the most common one, used widely as a solvent and formerly as an anaesthetic?", "o": ["ethoxyethane (diethyl ether)", "methoxymethane (dimethyl ether)", "ethoxypropane (ethyl propyl ether)", "methoxyethane (ethyl methyl ether)"], "a": 0, "g": 1}, {"id": 42, "t": 1, "l": "Ethers Q2", "q": "Each of the following is true about ethers EXCEPT that:", "o": ["ethers are relatively unreactive towards most reagents", "ethers have lower boiling points than alcohols of similar molar mass", "ethers are widely used as solvents for organic reactions", "epoxides and epoxyethanes are not 3−membered cyclic ethers"], "a": 3, "g": 1}, {"id": 43, "t": 1, "l": "Ethers Q3", "q": "The reaction of phenol with bromoethane yields an ether. The name of the reaction is:", "o": ["Cannizzaro's reaction", "Friedel-Crafts reaction", "Williamson's reaction", "Kolbe's reaction"], "a": 2, "g": 1}, {"id": 44, "t": 1, "l": "Ethers Q4", "q": "Butanol reacts with iodopropane to give butyl propyl ether. How is this brought about?", "o": ["By heating butanol with iodopropane in concentrated H2SO4, which removes water to join the two groups", "By oxidising butanol with acidified K2Cr2O7 and then adding iodopropane", "By the Williamson synthesis: the alcohol is first converted to its sodium alkoxide with sodium, and the alkoxide then displaces the iodide from the alkyl iodide", "By hydrolysing iodopropane to propanol, which then loses water with butanol"], "a": 2, "g": 1}, {"id": 45, "t": 1, "l": "Ethers Q5", "q": "The ether produced from butanol and iodopropane is:", "o": ["butyl propyl ether", "dibutyl ether", "dipropyl ether", "butyl propanoate"], "a": 0, "g": 1}, {"id": 46, "t": 1, "l": "Ethers Q6", "q": "The IUPAC name of CH3-C(OC2H5)(CH2CH3)-CH2-C(CH3)2-CH3 is:", "o": ["2−ethoxy-2,4,4−trimethylhexane", "3−ethoxy-3,5,5−trimethylheptane", "3−ethoxy-3,5,5−trimethylhexane", "3−ethoxy-2,2,4−trimethylpentane"], "a": 2, "g": 1}, {"id": 47, "t": 1, "l": "Ethers Q7", "q": "Give the common names of the following ethers: (i) C3H7-O-C2H5, (ii) C2H5CH2-O-C4H9, (iii) C6H5-O-C2H5, (iv) CH3-O-C6H5.", "o": ["methyl propyl ether, butyl ethyl ether, diphenyl ether and methyl phenyl ether", "ethyl propyl ether, dibutyl ether, ethyl phenyl ether and diphenyl ether", "ethyl propyl ether, butyl propyl ether, ethyl phenyl ether and methyl phenyl ether", "ethyl propyl ether, butyl propyl ether, ethyl benzyl ether and methyl benzyl ether"], "a": 2, "g": 1}, {"id": 48, "t": 1, "l": "Ethers Q8", "q": "This reaction CH3OCH2CH2CH3 + conc. HI in excess acid will yield:", "o": ["CH3OH and C3H7OH", "CH3I and C3H7OH", "CH3OH and C3H7I", "CH3I and C3H7I"], "a": 3, "g": 1}, {"id": 49, "t": 1, "l": "Ethers Q9", "q": "Identify the false statement about ethers. Ethers:", "o": ["can be cleaved by concentrated HI", "do not form hydrogen bonds with each other", "can be converted completely to alcohols", "are functional isomers of alcohols"], "a": 2, "g": 1}, {"id": 50, "t": 1, "l": "Ethers Q10", "q": "Give the IUPAC name of C2H5O-CH(C2H5)2 and of C5H11-O-C3H7.", "o": ["2−ethoxypentane and 1−propoxypentane", "3−ethoxypentane and 1−propoxypentane", "3−ethoxypentane and 1−pentyloxypropane", "3−propoxypentane and 1−ethoxypentane"], "a": 1, "g": 1}, {"id": 51, "t": 1, "l": "Ethers Q11", "q": "Cleavage reaction in ethers is a ____ reaction.", "o": ["electrophilic addition", "free radical substitution", "elimination", "nucleophilic substitution"], "a": 3, "g": 1}, {"id": 52, "t": 1, "l": "Ethers Q12", "q": "The reaction of butanol with iodopropane will give?", "o": ["dibutyl ether", "dipropyl ether", "butyl propyl ether", "propyl butyl ether"], "a": 2, "g": 1}, {"id": 53, "t": 2, "l": "Exam Q24", "q": "Primary and secondary amines react with acyl chlorides and anhydrides to produce", "o": ["C-alkyl", "Carbonyl", "S-alkyl", "N-alkyl"], "a": 3}, {"id": 54, "t": 2, "l": "Exam Q40", "q": "The IUPAC name for the compound CH3(C2H5)N–CH2CH2CH3 is", "o": ["1-ethyl,2-methylpropanamine", "1-ethyl,2-methyl-N-propanamine", "N-ethyl-N-methylpropanamine", "Ethyl methylpropanamine"], "a": 2}, {"id": 55, "t": 2, "l": "Exam Q102", "q": "Amines are derivatives of", "o": ["Ammonia", "Methane", "Benzene", "Ethanol"], "a": 0}, {"id": 56, "t": 2, "l": "Test Q60", "q": "The following are true of amines, EXCEPT", "o": ["Amines are basic, acidic, and neutral", "Amines have a lone pair on the nitrogen atom", "Amines react with HCl to produce fumes", "Amines form salts with acids"], "a": 0}, {"id": 57, "t": 2, "l": "Alkanamines Q1", "q": "The IUPAC name for CH3NH2 is:", "o": ["methanamine", "methanenitrile", "aminomethane", "methylamine only"], "a": 0}, {"id": 58, "t": 2, "l": "Alkanamines Q2", "q": "A primary amine reacts with trichloromethane (chloroform) and alcoholic KOH to form:", "o": ["an isocyanide (carbylamine), with a very unpleasant smell", "an amide", "an alcohol", "a nitrile"], "a": 0}, {"id": 59, "t": 2, "l": "Alkanamines Q3", "q": "Amines act both as bases and as nucleophiles because of:", "o": ["the acidity of the N-H bond", "their low molar mass", "the lone pair of electrons on nitrogen", "the polarity of the C-N bond"], "a": 2, "ns": 1}, {"id": 60, "t": 2, "l": "Alkanamines Q4", "q": "Alkanamines contain only carbon, hydrogen and which other atom?", "o": ["phosphorus", "oxygen", "sulphur", "nitrogen"], "a": 3}, {"id": 61, "t": 2, "l": "Alkanamines Q5", "q": "What is formed when amides are reduced with lithium tetrahydridoaluminate(III), LiAlH4?", "o": ["alcohols", "amines", "aldehydes", "carboxylic acids"], "a": 1}, {"id": 62, "t": 2, "l": "Alkanamines Q6", "q": "Alkylation of a primary amine generates:", "o": ["a secondary amine, and further alkylation gives tertiary amines and quaternary salts", "an amide", "a nitrile", "only a quaternary ammonium salt"], "a": 0}, {"id": 63, "t": 2, "l": "Alkanamines Q7", "q": "State five uses of amines.", "o": ["Only as fuels", "Only as fertilisers", "Medicines and anaesthetics (ephedrine, adrenaline, morphine), corrosion inhibitors in boilers and lubricating oils, antioxidants and stabilisers for rubber and explosives, dyes and photographic developers, and the manufacture of insecticides, herbicides and amino acids", "They have no practical uses"], "a": 2}, {"id": 64, "t": 2, "l": "Alkanamines Q8", "q": "The systematic IUPAC name of (CH3)N(C3H7)(CH2CH3) is ____ and it is a ____ amine.", "o": ["methylethylpropylamine, primary", "ethylmethylpropylamine, secondary", "ethylmethylpropylamine, tertiary", "propylmethylethylamine, quaternary"], "a": 2}, {"id": 65, "t": 2, "l": "Alkanamines Q9", "q": "Why is aniline first acylated with ethanoic anhydride before nitration, and hydrolysed afterwards?", "o": ["To convert aniline into a carboxylic acid", "Because aniline does not react with nitric acid at all", "To make the ring meta directing permanently", "Acylation tames the very strong activation and protects the NH2 group from the nitrating acid, so a single substitution (mainly para) is obtained, and hydrolysis then returns the free amine"], "a": 3}, {"id": 66, "t": 2, "l": "Alkanamines Q10", "q": "The systematic IUPAC name of (CH3)2N-CH2CH2CH3 is ___ and is a ___ amine.", "o": ["methylethylpropylamine, primary", "ethylmethylpropylamine, secondary", "dimethylpropylamine, tertiary", "propylmethylethylamine, quaternary"], "a": 2}, {"id": 67, "t": 2, "l": "Alkanamines Q11", "q": "Reductive amination of aldehydes and ketones will yield a ____ amine.", "o": ["primary", "secondary", "tertiary", "quaternary"], "a": 0}, {"id": 68, "t": 2, "l": "Alkanamines Q12", "q": "TRUE or FALSE? The crystalline salt of an amine is more stable than the amine.", "o": ["False", "True", "Both are equally stable", "It depends on the temperature only"], "a": 0, "ns": 1}, {"id": 69, "t": 2, "l": "Alkanamines Q13", "q": "A tertiary amine cannot be acylated because:", "o": ["its lone pair is missing", "it is insoluble in water", "there is no hydrogen bonded to its nitrogen", "it is not basic ssive nature", "Inertness nature", "Noble nature"], "a": 1}, {"id": 169, "t": 12, "l": "Exam Q11", "q": "Which of the following is true in the allotropy of element", "o": ["Same structure and same form", "Same structures, with different properties", "Different structures but different properties", "Different structures and different properties"], "a": 3}, {"id": 170, "t": 12, "l": "Exam Q111", "q": "The phenomenon where an element exists in different structural forms is called", "o": ["Isomerism", "Allotropy", "Isotopy", "Polymerism"], "a": 1}, {"id": 171, "t": 12, "l": "Fullerenes & Carbon Q7", "q": "Name some elements that exhibit allotropy, together with the allotropic forms of each.", "o": ["Carbon (diamond and graphite), nitrogen (N2 and N3), sodium (white and grey) and iron (red and black)", "Carbon (diamond only), oxygen (O2 only), sulphur (rhombic only) and phosphorus (white only)", "Carbon (diamond and graphite), hydrogen (H2 and H3), chlorine (Cl2 and Cl3) and tin (red and blue)", "Carbon (diamond, graphite, graphene, fullerenes, nanotubes), oxygen (O2 and ozone O3), sulphur (rhombic and monoclinic), phosphorus (white, red and black) and tin (grey and white)"], "a": 3, "g": 1}, {"id": 172, "t": 12, "l": "Fullerenes & Carbon Q9", "q": "Define allotropy. What other name can be used to describe the phenomenon?", "o": ["The existence of an element in two or more different isotopes; it is also called isotopy", "The existence of an element in two or more different physical forms in the same physical state; it is also called polymorphism when applied to elements", "The existence of two or more compounds with the same molecular formula; it is also called isomerism", "The existence of an element in different oxidation states; it is also called polymerism"], "a": 1, "g": 1}, {"id": 173, "t": 13, "l": "Exam Q15", "q": "Hybrid orbitals have all the following properties except", "o": ["Same bond", "Same size", "Same shape", "Same energy"], "a": 0}, {"id": 174, "t": 13, e:", "o": ["Lower atomic number", "Higher atomic number", "Smaller atomic radius", "Same atomic mass as hydrogen"], "a": 1, "x": 1}, {"id": 390, "t": 13, "l": "BAMSSA Organic Q24", "q": "The bond angle between sp³ hybrid orbitals is approximately:", "o": ["90°", "109.5°", "120°", "180°"], "a": 1, "x": 1}, {"id": 391, "t": 10, "l": "BAMSSA Organic Q25", "q": "In the test for sulphur, addition of lead ethanoate (acetate) solution to the acidified filtrate produces a black precipitate of:", "o": ["AgCN", "PbS", "Ag₂S", "Na₂S"], "a": 1, "x": 1}, {"id": 392, "t": 9, "l": "BAMSSA Organic Q26", "q": "Dehydrohalogenation of a vicinal (1,2-) dihalide with a strong base such as NaNH₂ produces:", "o": ["An alkane", "An alkyne", "An alcohol", "A carboxylic acid"], "a": 1, "x": 1}, {"id": 393, "t": 19, "l": "BAMSSA Organic Q27", "q": "Catenation is best described as:", "o": ["The ability of carbon to bond exclusively with oxygen", "The ability of an element to form chains and rings through self-linkage", "A method for purifying organic compounds", "The removal of hydrogen atoms from an alkane"], "a": 1, "x": 1}, {"id": 394, "t": 8, "l": "BAMSSA Organic Q28", "q": "Which statement correctly describes Markovnikov’s rule for addition of HX to an unsymmetrical alkene?", "o": ["The halogen goes to the carbon already bearing more hydrogen atoms", "The hydrogen of the reagent goes to the carbon of the double bond that already has the greater number of hydrogen atoms", "Addition always occurs at the terminal carbon regardless of substitution", "The more stable carbocation is never involved in determining the product"], "a": 1, "x": 1}, {"id": 395, "t": 10, "l": "BAMSSA Organic Q29", "q": "A blue or green coloration in the filtrate (after adding FeSO₄, Fe₂(SO₄)₃ and dilute H₂SO₄) confirms nitrogen because it indicates formation of:", "o": ["Silver cyanide", "Lead sulphide", "Prussian blue", "Sodium thiocyanate"], "a": 2, "x": 1}, {"id": 396, "t": 13, "l": "BAMSSA Organic Q30", "q": "The , "x": 1}, {"id": 420, "t": 17, "l": "BAMSSA Inorganic Q15", "q": "In the Downs cell process for extracting sodium, calcium chloride is added to the molten sodium chloride mainly to:", "o": ["Increase the electrical conductivity of the melt only", "Lower the melting point of the electrolyte mixture", "Serve as the primary source of the sodium produced", "Prevent oxidation of the chlorine gas produced at the anode"], "a": 1, "x": 1}, {"id": 421, "t": 16, "l": "BAMSSA Inorganic Q16", "q": "The electronegativity values of Group 1A elements are generally:", "o": ["The highest among all groups in the periodic table", "Among the smallest of any group, decreasing further down the group", "Identical to those of the halogens", "Increasing steadily down the group"], "a": 1, "x": 1}, {"id": 422, "t": 17, "l": "BAMSSA Inorganic Q17", "q": "A naturally occurring material containing a sufficiently high concentration of a mineral for economical metal recovery is called a/an:", "o": ["Alloy", "Ore", "Gangue", "Flux"], "a": 1, "x": 1}, {"id": 423, "t": 11, "l": "BAMSSA Inorganic Q18", "q": "An element with the electron configuration [Xe]6s² is:", "o": ["Caesium", "Barium", "Radium", "Francium"], "a": 1, "x": 1}, {"id": 424, "t": 17, "l": "BAMSSA Inorganic Q19", "q": "In the extraction of aluminium, impurities in bauxite are removed by digesting the ore with sodium hydroxide. This is an example of which concentration method?", "o": ["Magnetic separation", "Froth floatation", "Chemical (leaching) method", "Gravity separation"], "a": 2, "x": 1}, {"id": 425, "t": 16, "l": "BAMSSA Inorganic Q20", "q": "Which alkali metal reacts directly with nitrogen gas to form a stable nitride (M₃N)?", "o": ["Sodium", "Potassium", "Lithium", "Caesium"], "a": 2, "x": 1}, {"id": 426, "t": 18, "l": "BAMSSA Inorganic Q21", "q": "Which group(s) show an exception to the general trend of electron affinity becoming more negative across a period? (i) Group 2A (ii) Group 5A (iii) Group 8A (iv) Group 7A", "o": ["
